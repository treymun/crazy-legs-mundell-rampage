name: Set up Godot and the game data
description: >
  Installs the Godot editor (and, for a build, the export templates), packs the
  assets the project reads (tools/pack_assets.gd), stamps the tag version on
  release builds, imports the project and bakes the levels' nav graphs and
  wreck pieces (pack_assets.gd -- bake). The editor, the templates, the
  packs and the import cache (.godot/) are each kept between runs; the packs
  and the import cache are saved only by a job that asks (save-cache), so the
  parallel jobs of one run do not race to save the same thing. No Python.
  Linux runners only.

inputs:
  godot-version:
    description: Godot release to build with (must match godot/project.godot).
    default: "4.7.2"
  templates:
    description: "'true' also installs the export templates (the build jobs)."
    default: "false"
  save-cache:
    description: "'true' saves the packs and the import cache when this run made new ones."
    default: "false"

runs:
  using: composite
  steps:
    - name: Restore the Godot editor
      id: editor
      uses: actions/cache@v4
      with:
        path: ~/godot
        key: godot-editor-${{ inputs.godot-version }}-linux

    - name: Download the Godot editor
      if: steps.editor.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.godot-version }}
      run: |
        set -euo pipefail
        base="https://github.com/godotengine/godot/releases/download/${VERSION}-stable"
        editor="Godot_v${VERSION}-stable_linux.x86_64.zip"
        work="$RUNNER_TEMP/godot-editor"
        mkdir -p "$work" ~/godot
        cd "$work"
        curl -fsSL --retry 3 -O "$base/$editor" -O "$base/SHA512-SUMS.txt"
        grep -E "  $editor\$" SHA512-SUMS.txt | sha512sum --check --strict
        unzip -q -j "$editor" -d ~/godot
        mv ~/godot/Godot_v${VERSION}-stable_linux.x86_64 ~/godot/godot
        chmod +x ~/godot/godot
        rm -rf "$work"

    - name: Restore the export templates
      id: templates
      if: inputs.templates == 'true'
      uses: actions/cache@v4
      with:
        path: ~/.local/share/godot/export_templates
        key: godot-templates-${{ inputs.godot-version }}-windows-web-weblite-android

    - name: Download the export templates
      if: inputs.templates == 'true' && steps.templates.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.godot-version }}
      run: |
        set -euo pipefail
        base="https://github.com/godotengine/godot/releases/download/${VERSION}-stable"
        templates="Godot_v${VERSION}-stable_export_templates.tpz"
        work="$RUNNER_TEMP/godot-templates"
        mkdir -p "$work" ~/.local/share/godot/export_templates/${VERSION}.stable
        cd "$work"
        curl -fsSL --retry 3 -O "$base/$templates" -O "$base/SHA512-SUMS.txt"
        grep -E "  $templates\$" SHA512-SUMS.txt | sha512sum --check --strict
        # The archive holds every platform (1.3 GB); the release needs these
        # (the browser build ships with and without threads).
        unzip -q -j "$templates" \
          templates/version.txt \
          templates/windows_release_x86_64.exe \
          templates/web_release.zip \
          templates/web_nothreads_release.zip \
          templates/android_release.apk \
          -d ~/.local/share/godot/export_templates/${VERSION}.stable
        rm -rf "$work"

    - name: Restore the asset packs
      id: packs
      uses: actions/cache/restore@v4
      with:
        path: godot/assets_gen
        key: packs-${{ hashFiles('assets/art/**', 'assets/tiles/**', 'audio_src/manifest.json', 'audio_src/final/sfx/**', 'godot/assets/music/**', 'godot/assets_gen/tiles_index.json', 'godot/tools/pack_assets.gd', 'godot/src/assets.gd') }}

    - name: Pack the assets
      if: steps.packs.outputs.cache-hit != 'true'
      shell: bash
      run: ~/godot/godot --headless --path godot --script res://tools/pack_assets.gd

    - name: Save the asset packs
      if: inputs.save-cache == 'true' && steps.packs.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: godot/assets_gen
        key: ${{ steps.packs.outputs.cache-primary-key }}

    - name: Stamp the release version
      if: github.ref_type == 'tag'
      shell: bash
      run: ~/godot/godot --headless --path godot --script res://tools/version.gd -- "$GITHUB_REF_NAME"

    # The import cache: the models' and icons' imports and the script class
    # cache. Keyed on the imported files; any older one is restored otherwise
    # and the import below redoes only what changed.
    - name: Restore the import cache
      id: imported
      uses: actions/cache/restore@v4
      with:
        path: godot/.godot
        key: godot-import-${{ inputs.godot-version }}-${{ hashFiles('godot/assets3d/**', 'godot/icons/**', 'godot/**/*.import') }}
        restore-keys: godot-import-${{ inputs.godot-version }}-

    - name: Import the project
      shell: bash
      run: |
        echo "$HOME/godot" >> "$GITHUB_PATH"
        ~/godot/godot --version
        # Builds the script class cache and imports the models and icons;
        # without it the first headless run cannot resolve the project's
        # class names.
        ~/godot/godot --headless --path godot --import > "$RUNNER_TEMP/godot-import.log" 2>&1 || true
        if grep -E "SCRIPT ERROR|Parse Error" "$RUNNER_TEMP/godot-import.log"; then
          cat "$RUNNER_TEMP/godot-import.log"
          exit 1
        fi

    # Each level's nav graph and its breakables' wreck pieces (tools/level_bake.gd)
    # need the import's class names and models, so they are baked here, after it,
    # every run (a few seconds): packs restored from the cache may be older than
    # the levels, models and scripts the bakes are made from.
    - name: Bake the levels
      shell: bash
      run: |
        ~/godot/godot --headless --path godot --script res://tools/pack_assets.gd -- bake 2>&1 | tee "$RUNNER_TEMP/bake.log"
        grep -q "BAKES WRITTEN" "$RUNNER_TEMP/bake.log"

    - name: Save the import cache
      if: inputs.save-cache == 'true' && steps.imported.outputs.cache-hit != 'true'
      uses: actions/cache/save@v4
      with:
        path: godot/.godot
        key: ${{ steps.imported.outputs.cache-primary-key }}
