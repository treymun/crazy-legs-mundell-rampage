name: Set up Godot and the game data
description: >
  Rebuilds the asset packs the Godot project reads from assets/, installs the
  Godot editor and the four export templates the release uses, stamps the tag
  version on release builds, and imports the project. Linux runners only.

inputs:
  godot-version:
    description: Godot release to build with (must match godot/project.godot).
    default: "4.7.2"

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"

    - name: Build the asset packs
      shell: bash
      run: |
        pip install --quiet $(grep -iE '^(numpy|pillow)==' requirements.txt)
        python scripts/build_godot_data.py

    - name: Stamp the release version
      if: github.ref_type == 'tag'
      shell: bash
      run: python scripts/godot_version.py --set "$GITHUB_REF_NAME"

    - name: Restore Godot
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/godot
          ~/.local/share/godot/export_templates
        key: godot-${{ inputs.godot-version }}-linux-windows-web-weblite-android

    - name: Download Godot
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        VERSION: ${{ inputs.godot-version }}
      run: |
        set -euo pipefail
        base="https://github.com/godotengine/godot/releases/download/${VERSION}-stable"
        editor="Godot_v${VERSION}-stable_linux.x86_64.zip"
        templates="Godot_v${VERSION}-stable_export_templates.tpz"
        work="$RUNNER_TEMP/godot-download"
        mkdir -p "$work" ~/godot ~/.local/share/godot/export_templates/${VERSION}.stable
        cd "$work"
        curl -fsSL --retry 3 -O "$base/$editor" -O "$base/$templates" -O "$base/SHA512-SUMS.txt"
        grep -E "  ($editor|$templates)\$" SHA512-SUMS.txt | sha512sum --check --strict
        unzip -q -j "$editor" -d ~/godot
        mv ~/godot/Godot_v${VERSION}-stable_linux.x86_64 ~/godot/godot
        chmod +x ~/godot/godot
        # The archive holds every platform (1.3 GB); the release needs four files
        # (the browser build ships with and without threads).
        unzip -q -j "$templates" \
          templates/version.txt \
          templates/windows_release_x86_64.exe \
          templates/web_release.zip \
          templates/web_nothreads_release.zip \
          templates/android_release.apk \
          -d ~/.local/share/godot/export_templates/${VERSION}.stable
        rm -rf "$work"

    - name: Import the project
      shell: bash
      run: |
        echo "$HOME/godot" >> "$GITHUB_PATH"
        ~/godot/godot --version
        # Builds the script class cache and imports the icons; without it the
        # first headless run cannot resolve the project's class names.
        ~/godot/godot --headless --path godot --import > "$RUNNER_TEMP/godot-import.log" 2>&1 || true
        if grep -E "SCRIPT ERROR|Parse Error" "$RUNNER_TEMP/godot-import.log"; then
          cat "$RUNNER_TEMP/godot-import.log"
          exit 1
        fi
