name: Build, release and publish

# Every push runs the checks and the shader-view comparison. A push to main, a
# v* tag or a run started by hand also exports the Windows, Web and Android
# builds (they take most of a run's time, so a branch push skips them); main
# also deploys the landing page with the browser builds under play/. A v* tag
# stamps its version into the builds, deploys, and publishes the EXE, the
# installer and the APK as a GitHub release.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint and headless checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot
      - name: Format and lint the GDScript
        working-directory: godot
        run: |
          pipx install "$(grep -E '^gdtoolkit==' ../requirements-dev.txt | cut -d' ' -f1)"
          gdformat --check src tools
          gdlint src tools
      - name: The display shader fits a WebGL page's 16 textures
        run: godot --headless --path godot --script res://tools/check_shader.gd
      - name: Boot the game headless
        run: |
          godot --headless --path godot --quit-after 100 2>&1 | tee boot.log
          if grep -E "SCRIPT ERROR|Parse Error|not declared|Failed to load" boot.log; then
            echo "::error::The game logged script errors while booting."
            exit 1
          fi
      - name: Assets and levels load
        run: godot --headless --path godot --script res://tools/verify_assets.gd
      - name: Parity regression checks
        run: godot --headless --path godot --script res://tools/check_fixes.gd
      - name: Campaign walkthrough
        run: godot --headless --path godot --script res://tools/bot_campaign.gd
      - name: Pictures match their references
        run: |
          godot --headless --path godot --script res://tools/picture_check.gd --             "out=$RUNNER_TEMP/pictures" annotate 2>&1 | tee pictures.log
          grep -q "PICTURES OK" pictures.log
      - name: Frame time
        run: |
          # A shared runner is slow and noisy: this only catches a big slowdown.
          # The real numbers come from tools/bench.gd and main.gd --view-bench
          # on a desktop.
          godot --headless --path godot --script res://tools/bench.gd -- 120 max=60 2>&1 | tee bench.log
          grep -q "SPEED OK" bench.log
          { echo '### Frame time (headless, CPU side only)'; echo '```'; grep -E "fps|OK|SLOW" bench.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the picture check's renders
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pictures
          path: ${{ runner.temp }}/pictures
          if-no-files-found: ignore

  window:
    name: Shader view matches the software view
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot
      - name: A virtual screen and Mesa's software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 > /dev/null
      - name: Draw every viewpoint both ways in a real window
        run: |
          mkdir -p "$RUNNER_TEMP/views"
          xvfb-run -a -s "-screen 0 1280x800x24"             godot --path godot --rendering-driver opengl3 --audio-driver Dummy --resolution 1280x800 --             --view-tour=res://tools/picture_views.json "--view-out=$RUNNER_TEMP/views" 2>&1 | tee window.log
          if grep -E "SCRIPT ERROR|Parse Error|SHADER ERROR" window.log; then exit 1; fi
      - name: Compare
        run: |
          godot --headless --path godot --script res://tools/compare_views.gd -- "$RUNNER_TEMP/views"
      - name: Keep the frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: views
          path: ${{ runner.temp }}/views
          if-no-files-found: ignore

  windows:
    name: Windows EXE
    needs: checks
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot
      - name: Export the single-file EXE
        run: |
          mkdir -p godot/build/windows
          godot --headless --path godot --export-release "Windows Desktop" \
            build/windows/CrazyLegsMundellRampage.exe 2>&1 | tee export.log
          if grep -iE "export .*failed|SCRIPT ERROR" export.log; then exit 1; fi
          test -s godot/build/windows/CrazyLegsMundellRampage.exe
          ls -lh godot/build/windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          if-no-files-found: error
          compression-level: 0
          path: godot/build/windows/CrazyLegsMundellRampage.exe

  installer:
    name: Windows installer
    needs: windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: godot/build/windows
      - name: Smoke test the EXE
        shell: pwsh
        run: |
          $marker = Join-Path $PWD "smoke.txt"
          $proc = Start-Process -FilePath "godot/build/windows/CrazyLegsMundellRampage.exe" `
            -ArgumentList "--headless", "--", "--smoke-frames=180", "--smoke-marker=$($marker -replace '\\','/')" `
            -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "The EXE exited $($proc.ExitCode)" }
          if (!(Test-Path $marker)) { throw "The EXE did not write its smoke marker" }
          Get-Content $marker
          if (!(Select-String -Path $marker -Pattern "State: play" -Quiet)) { throw "The EXE did not reach play" }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") { $version = $env:GITHUB_REF_NAME.TrimStart("v") }
          else { $version = ([regex]::Match((Get-Content godot/project.godot -Raw), 'config/version="([^"]*)"')).Groups[1].Value }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppFullVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          compression-level: 0
          path: |
            godot/build/windows/CrazyLegsMundellRampage.exe
            dist/CrazyLegsMundellRampage_Setup.exe

  android:
    name: Android APK
    needs: checks
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/godot
      - name: Point Godot at the Android SDK and a signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release.keystore"
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            user="$KEYSTORE_USER"
            password="$KEYSTORE_PASSWORD"
          else
            # Without the three ANDROID_KEYSTORE_* secrets each run signs with
            # a fresh key, so a phone must uninstall the old copy before it
            # will take a newer APK.
            user="crazylegs"
            password="hickston-ci-only"
            keytool -genkeypair -keystore "$keystore" -storepass "$password" \
              -keypass "$password" -alias "$user" -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Crazy Legs Mundell Rampage CI, O=Hickston Inc."
            echo "::notice::Signed with a throwaway key (no ANDROID_KEYSTORE_* secrets set)."
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$user"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$password"
          } >> "$GITHUB_ENV"
          mkdir -p ~/.config/godot
          for name in editor_settings-4.tres editor_settings-4.7.tres; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo
              echo '[resource]'
              echo "export/android/java_sdk_path = \"$JAVA_HOME\""
              echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            } > ~/.config/godot/$name
          done
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platform-tools/adb"
      - name: Export the APK
        run: |
          mkdir -p godot/build/android
          godot --headless --path godot --export-release "Android" \
            build/android/CrazyLegsMundellRampage.apk 2>&1 | tee export.log
          if grep -iE "export .*failed|SCRIPT ERROR" export.log; then exit 1; fi
          test -s godot/build/android/CrazyLegsMundellRampage.apk
          ls -lh godot/build/android
      - name: Check the package
        run: |
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$tools/apksigner" verify --print-certs godot/build/android/CrazyLegsMundellRampage.apk
          "$tools/aapt2" dump badging godot/build/android/CrazyLegsMundellRampage.apk \
            | grep -E "^(package|sdkVersion|targetSdkVersion|native-code|application-label):"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          compression-level: 0
          path: godot/build/android/CrazyLegsMundellRampage.apk

  web:
    name: Browser build and landing page
    needs: checks
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot
      - name: Export the WebAssembly build
        run: |
          mkdir -p godot/build/web godot/build/web-lite
          godot --headless --path godot --export-release "Web" build/web/index.html 2>&1 | tee export.log
          # The lighter build has no threads: it is what iPhones, iPads and any
          # browser that will not isolate the page are sent to (play/lite/).
          godot --headless --path godot --export-release "Web Lite" build/web-lite/index.html 2>&1 | tee -a export.log
          if grep -iE "export .*failed|SCRIPT ERROR" export.log; then exit 1; fi
          # Each chapter's music is left out of index.pck and fetched after the
          # game starts (src/pack_loader.gd), from packs beside it.
          godot --headless --path godot --script res://tools/make_packs.gd -- build/web 2>&1 | tee packs.log
          grep -q "PACKS OK" packs.log
          cp godot/build/web/packs.json godot/build/web/music_*.pck godot/build/web-lite/
          for build in web web-lite; do
            test -s godot/build/$build/index.wasm
            test -s godot/build/$build/index.pck
            test -s godot/build/$build/packs.json
            ls -lh godot/build/$build
          done
      - name: Assemble the Pages site
        run: |
          mkdir -p _site/play
          cp -r site/. _site/
          cp -r godot/build/web/. _site/play/
          mkdir -p _site/play/lite
          cp -r godot/build/web-lite/. _site/play/lite/
          godot --headless --path godot --script res://tools/version.gd | tail -n 1 > _site/version.txt
          du -sh _site
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
        with:
          path: _site

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [installer, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{windows,android}"
          merge-multiple: true
          path: release
      - name: Flatten the downloads
        run: |
          find release -type f \( -name '*.exe' -o -name '*.apk' \) -exec mv -n {} release/ \;
          find release -mindepth 1 -type d -empty -delete
          ls -lh release
      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true

  pages:
    name: Deploy GitHub Pages
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    needs: [web]
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
