name: Build, release and publish

# Every push runs the checks side by side: the lint, every row of
# tools/check_all.gd shared over six runners (check_fixes in its six parts),
# and the window job (boot, the art tools, the 3D view's pictures, the frame
# time). Builds wait for all of them:
# - a branch push builds nothing (but android-check, below);
# - main builds the browser builds and deploys the landing page (play/);
# - a v* tag builds the EXE, the installer and the APK and publishes them as
#   a GitHub release, with update.json (each file's size and SHA-256: what
#   the game's in-game Android update checks its download against);
# - a push to the branch android-check also builds the APK (whatever the
#   checks say), to prove the Android build before a tag;
# - a run started by hand builds all four as run artifacts (input `builds`).
# A push to main or a v* tag whose commit already passed a run of this
# workflow (tools/release.gd pushes them only after the branch's run passed)
# skips the checks and goes straight to its builds (the job `earlier`).

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      builds:
        description: Export the EXE, installer, APK and browser builds as run artifacts
        type: boolean
        default: true

permissions:
  actions: read
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  earlier:
    name: Checks passed on this commit already?
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    outputs:
      passed: ${{ steps.look.outputs.passed }}
    steps:
      - name: Look for a passed run of this workflow on the same commit
        id: look
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Any failure here leaves passed=false, and the checks then run.
          count=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release.yml/runs?head_sha=$GITHUB_SHA&status=success&per_page=100" \
            --jq "[.workflow_runs[] | select(.id != $GITHUB_RUN_ID)] | length" 2>/dev/null || echo 0)
          if [ "${count:-0}" -gt 0 ] 2>/dev/null; then passed=true; else passed=false; fi
          echo "passed=$passed" >> "$GITHUB_OUTPUT"
          echo "::notice::Passed runs of this workflow on $GITHUB_SHA: ${count:-0} (skip the checks: $passed)"

  lint:
    name: Format and lint the GDScript
    needs: earlier
    if: ${{ !cancelled() && needs.earlier.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Whether the lasting Android signing key is set, readable without a
      # login from the job's annotations (check-runs/<job>/annotations): a
      # notice "Android signing key: set" or a warning that it is not. Never
      # read the step's conclusion for this: it always passes. It prints only
      # "set" or "missing", never a value.
      - name: Android signing key secrets (see the annotation)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          missing=0
          for name in KEYSTORE_BASE64 KEYSTORE_USER KEYSTORE_PASSWORD; do
            if [ -n "${!name}" ]; then echo "ANDROID_$name: set"; else echo "ANDROID_$name: missing"; missing=1; fi
          done
          if [ "$missing" = 1 ]; then
            echo "::warning::The lasting Android signing key is not set: a v* tag's APK job will refuse to publish."
          else
            echo "::notice::Android signing key: set"
          fi
      - id: python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore gdtoolkit
        id: venv
        uses: actions/cache@v4
        with:
          path: ~/gdtoolkit-venv
          key: gdtoolkit-${{ runner.os }}-py${{ steps.python.outputs.python-version }}-${{ hashFiles('requirements-dev.txt') }}
      - name: Install gdtoolkit
        if: steps.venv.outputs.cache-hit != 'true'
        run: |
          python -m venv ~/gdtoolkit-venv
          ~/gdtoolkit-venv/bin/pip install -q "$(grep -E '^gdtoolkit==' requirements-dev.txt | cut -d' ' -f1)"
      - name: gdformat and gdlint
        working-directory: godot
        run: |
          ~/gdtoolkit-venv/bin/gdformat --check src tools addons
          ~/gdtoolkit-venv/bin/gdlint src tools addons
      # The sound measured (scripts/audio_qa.py, docs/dev/audio.md "Audio QA"):
      # every finished cue and song against its family, its edges, silences and
      # loop joins, and every cue the game names made. The songs are measured
      # only where the runner has ffmpeg.
      - name: Audio QA
        run: |
          python -m pip install -q "$(grep -E '^numpy==' requirements.txt | cut -d' ' -f1)"
          python scripts/audio_qa.py --check

  checks:
    name: Checks ${{ matrix.shard }} of 6
    needs: earlier
    if: ${{ !cancelled() && needs.earlier.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Keep the 6 in the name and the shard= argument below in step.
        shard: [1, 2, 3, 4, 5, 6]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot
        with:
          save-cache: ${{ matrix.shard == 1 }}
      - name: This share of tools/check_all.gd
        shell: bash
        run: |
          # check_all shares its rows out by CI_SECONDS (every row is in one
          # share) and runs two at a time; full prints each row's output in
          # a folded group, then the table with each row's time. The last
          # line decides; the table goes on the run's summary either way.
          godot --headless --path godot --script res://tools/check_all.gd -- \
            shard=${{ matrix.shard }}/6 jobs=2 full 2>&1 | tee checks.log || true
          { echo '### Checks ${{ matrix.shard }} of 6'; echo '```'; grep -E "^(shard |[a-z0-9_]+ +(ok|FAILED) |ALL CHECKS OK|[0-9]+ FAILED)" checks.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          grep -q "ALL CHECKS OK" checks.log

  window:
    name: Boot, art tools, the 3D view's pictures, frame time
    needs: earlier
    if: ${{ !cancelled() && needs.earlier.outputs.passed != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot
      - name: Boot the game headless
        run: |
          godot --headless --path godot --quit-after 100 2>&1 | tee boot.log
          if grep -E "SCRIPT ERROR|Parse Error|not declared|Failed to load" boot.log; then
            echo "::error::The game logged script errors while booting."
            exit 1
          fi
      - name: The art tools still run
        run: |
          for tool in build_fx_art build_building_tiles build_menu_art build_gore_art; do
            godot --headless --path godot --script res://tools/art/$tool.gd -- "out=$RUNNER_TEMP/art" 2>&1 | tee art.log
            if grep -E "SCRIPT ERROR|Parse Error" art.log; then exit 1; fi
          done
          test -s "$RUNNER_TEMP/art/fx_fire_0.png" && test -s "$RUNNER_TEMP/art/menu_board.png"
      - name: A virtual screen and Mesa's software OpenGL
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xvfb libgl1-mesa-dri libglx-mesa0 > /dev/null
      - name: The 3D view draws every viewpoint
        run: |
          mkdir -p "$RUNNER_TEMP/views3d"
          xvfb-run -a -s "-screen 0 1280x800x24" godot --path godot --rendering-driver opengl3 --audio-driver Dummy --resolution 1280x800 -- --view-tour=res://tools/picture_views.json "--view-out=$RUNNER_TEMP/views3d" 2>&1 | tee window3d.log
          if grep -E "SCRIPT ERROR|Parse Error|SHADER ERROR" window3d.log; then exit 1; fi
          test -s "$RUNNER_TEMP/views3d/hickston_01_0_3d.png"
      - name: The 3D view matches its references
        run: |
          godot --headless --path godot --script res://tools/compare_3d.gd -- "$RUNNER_TEMP/views3d" 2>&1 | tee compare3d.log
          # Each moved picture also as an annotation: those can be read from
          # the public API without a login (the log cannot).
          if ! grep -q "PICTURES 3D OK" compare3d.log; then
            grep -E "MOVED|MISSING|PICTURES 3D|ERROR" compare3d.log | head -40 | sed 's/^/::error title=3D view::/'
            exit 1
          fi
      - name: Frame time
        run: |
          # A shared runner is slow and noisy: this only catches a big slowdown.
          # The real numbers come from tools/bench.gd and main.gd --view-bench
          # on a desktop. Nothing else runs on this runner meanwhile.
          godot --headless --path godot --script res://tools/bench.gd -- 120 max=60 2>&1 | tee bench.log
          grep -q "SPEED OK" bench.log
          { echo '### Frame time (headless, CPU side only)'; echo '```'; grep -E "fps|OK|SLOW" bench.log; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the frames
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: views
          path: ${{ runner.temp }}/views3d
          if-no-files-found: ignore

  # The builds run only when every check above passed in this run, or the
  # job `earlier` found a passed run on this same commit.
  windows:
    name: Windows EXE
    needs: [earlier, lint, checks, window]
    if: >-
      ${{ !cancelled()
      && (startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.builds))
      && (needs.earlier.outputs.passed == 'true'
          || (needs.lint.result == 'success' && needs.checks.result == 'success' && needs.window.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot
        with:
          templates: "true"
      - name: Export the single-file EXE
        run: |
          mkdir -p godot/build/windows
          godot --headless --path godot --export-release "Windows Desktop" \
            build/windows/CrazyLegsMundellRampage.exe 2>&1 | tee export.log
          if grep -iE "export .*failed|SCRIPT ERROR" export.log; then exit 1; fi
          test -s godot/build/windows/CrazyLegsMundellRampage.exe
          ls -lh godot/build/windows
      - uses: actions/upload-artifact@v4
        with:
          name: windows-exe
          if-no-files-found: error
          compression-level: 0
          path: godot/build/windows/CrazyLegsMundellRampage.exe

  installer:
    name: Windows installer
    needs: windows
    if: ${{ !cancelled() && needs.windows.result == 'success' }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: windows-exe
          path: godot/build/windows
      - name: Smoke test the EXE
        shell: pwsh
        run: |
          $marker = Join-Path $PWD "smoke.txt"
          $proc = Start-Process -FilePath "godot/build/windows/CrazyLegsMundellRampage.exe" `
            -ArgumentList "--headless", "--", "--smoke-frames=180", "--smoke-marker=$($marker -replace '\\','/')" `
            -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "The EXE exited $($proc.ExitCode)" }
          if (!(Test-Path $marker)) { throw "The EXE did not write its smoke marker" }
          Get-Content $marker
          if (!(Select-String -Path $marker -Pattern "State: play" -Quiet)) { throw "The EXE did not reach play" }
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Build the installer
        shell: pwsh
        run: |
          if ($env:GITHUB_REF_TYPE -eq "tag") { $version = $env:GITHUB_REF_NAME.TrimStart("v") }
          else { $version = ([regex]::Match((Get-Content godot/project.godot -Raw), 'config/version="([^"]*)"')).Groups[1].Value }
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DMyAppFullVersion=$version" installer.iss
          if ($LASTEXITCODE -ne 0) { throw "ISCC exited $LASTEXITCODE" }
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          if-no-files-found: error
          compression-level: 0
          path: |
            godot/build/windows/CrazyLegsMundellRampage.exe
            dist/CrazyLegsMundellRampage_Setup.exe

  # A Gradle build (the preset's gradle_build/use_gradle_build): Godot's
  # Android build template from the export templates' android_source.zip,
  # installed into godot/android/ by the export itself, and the updater
  # plugin's AAR (tools/android_plugin.gd, from addons/clmr_updater/java),
  # which the addon's export plugin hands to the build. Neither is committed.
  android:
    name: Android APK
    needs: [earlier, lint, checks, window]
    if: >-
      ${{ !cancelled()
      && ((github.event_name == 'push' && github.ref == 'refs/heads/android-check')
          || ((startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.builds))
              && (needs.earlier.outputs.passed == 'true'
                  || (needs.lint.result == 'success' && needs.checks.result == 'success' && needs.window.result == 'success')))) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: ./.github/actions/godot
        with:
          templates: "true"
      - name: The Android SDK packages the build template wants
        run: |
          set -euo pipefail
          # The 4.7.2 template's config.gradle: compileSdk 36, build tools 36.1.0.
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install \
            "platform-tools" "build-tools;36.1.0" "platforms;android-36" > sdkmanager.log
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platforms"
      - name: Restore Gradle's downloads
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-godot-4.7.2-${{ hashFiles('godot/addons/clmr_updater/aar/AndroidManifest.xml') }}
          restore-keys: gradle-godot-4.7.2-
      - name: The updater plugin
        run: |
          godot --headless --path godot --script res://tools/android_plugin.gd 2>&1 | tee plugin.log
          grep -q "ANDROID PLUGIN BUILT" plugin.log
      - name: Point Godot at the Android SDK and a signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          keystore="$RUNNER_TEMP/release.keystore"
          if [ "$RELEASE_TAG" = "true" ] && { [ -z "$KEYSTORE_BASE64" ] || [ -z "$KEYSTORE_USER" ] || [ -z "$KEYSTORE_PASSWORD" ]; }; then
            # A published APK must install over the last one (the update
            # notice sends phones straight to it), so a tag signs it with the
            # lasting key or publishes nothing.
            echo "::error::A v* tag signs the APK with the lasting key, but the ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_USER and ANDROID_KEYSTORE_PASSWORD secrets are not all set. Add them (Settings > Secrets and variables > Actions) and re-run this tag's workflow. No throwaway-signed APK is published."
            exit 1
          fi
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$keystore"
            user="$KEYSTORE_USER"
            password="$KEYSTORE_PASSWORD"
          else
            # A branch or hand-started run without the three ANDROID_KEYSTORE_*
            # secrets signs with a fresh key: that APK will not install over a
            # published one (uninstall first). A v* tag never gets here.
            user="crazylegs"
            password="hickston-ci-only"
            keytool -genkeypair -keystore "$keystore" -storepass "$password" \
              -keypass "$password" -alias "$user" -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=Crazy Legs Mundell Rampage CI, O=Hickston Inc."
            echo "::notice::Signed with a throwaway key (no ANDROID_KEYSTORE_* secrets set)."
          fi
          {
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PATH=$keystore"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_USER=$user"
            echo "GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=$password"
          } >> "$GITHUB_ENV"
          mkdir -p ~/.config/godot
          for name in editor_settings-4.tres editor_settings-4.7.tres; do
            {
              echo '[gd_resource type="EditorSettings" format=3]'
              echo
              echo '[resource]'
              echo "export/android/java_sdk_path = \"$JAVA_HOME\""
              echo "export/android/android_sdk_path = \"$ANDROID_HOME\""
            } > ~/.config/godot/$name
          done
          ls "$ANDROID_HOME/build-tools" "$ANDROID_HOME/platform-tools/adb"
      - name: The phones' lighter copy of the art and music
        run: |
          # tools/pack_lite.gd re-encodes the music with ffmpeg.
          command -v ffmpeg > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; }
          godot --headless --path godot --script res://tools/pack_lite.gd 2>&1 | tee lite.log
          grep -q "LITE PACKS WRITTEN.*music re-encoded" lite.log
      - name: Export the APK
        run: |
          mkdir -p godot/build/android
          # Installs the build template from android_source.zip, then runs Gradle.
          godot --headless --path godot --install-android-build-template --export-release "Android" \
            build/android/CrazyLegsMundellRampage.apk 2>&1 | tee export.log
          if grep -iE "export .*failed|SCRIPT ERROR|BUILD FAILED|updater is not built" export.log; then exit 1; fi
          test -s godot/build/android/CrazyLegsMundellRampage.apk
          ls -lh godot/build/android
      - name: Check the package
        env:
          RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          set -euo pipefail
          apk=godot/build/android/CrazyLegsMundellRampage.apk
          tools="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -n 1)"
          "$tools/apksigner" verify --print-certs "$apk" | tee certs.txt
          "$tools/aapt2" dump badging "$apk" > badging.txt
          grep -E "^(package|sdkVersion|targetSdkVersion|native-code|application-label):" badging.txt
          # A phone updates an installed copy only from the same package name,
          # the same key and a higher version code (tools/version.gd stamps
          # it; tools/update_check.gd holds the presets to all of this).
          grep -q "^package: name='com.hickston.crazylegsmundell'" badging.txt \
            || { echo "::error::The APK's package name changed: phones would install it beside the old one."; exit 1; }
          code=$(sed -n "s/^package: .*versionCode='\([0-9]*\)'.*/\1/p" badging.txt)
          if [ -z "$code" ] || [ "$code" -lt 3110099 ]; then
            echo "::error::The APK's version code ($code) is below 3.11.0's (3110099): phones would refuse it as an update (a downgrade)."
            exit 1
          fi
          if [ "$RELEASE_TAG" = "true" ] && grep -q "Crazy Legs Mundell Rampage CI" certs.txt; then
            echo "::error::This tag's APK is signed with the throwaway CI key: it would not install over the last release."
            exit 1
          fi
          # The in-game update (src/update_notice.gd): leave to open the
          # package installer, the updater plugin Godot finds by its
          # manifest entry, godot-lib's FileProvider for the content://
          # address, and the rumble's vibrate.
          "$tools/aapt2" dump xmltree --file AndroidManifest.xml "$apk" > manifest.txt
          for want in 'android.permission.REQUEST_INSTALL_PACKAGES' \
            'org.godotengine.plugin.v2.CrazyLegsUpdater' \
            'com.hickston.crazylegs.updater.CrazyLegsUpdater' \
            'com.hickston.crazylegsmundell.fileprovider' \
            'android.permission.VIBRATE'; do
            grep -q "\"$want\"" manifest.txt \
              || { echo "::error::The APK's manifest lacks $want: it cannot update itself."; exit 1; }
          done
          unzip -p "$apk" 'classes*.dex' > dex.bin
          grep -aq "Lcom/hickston/crazylegs/updater/CrazyLegsUpdater;" dex.bin \
            || { echo "::error::The APK's code lacks the updater plugin's class."; exit 1; }
          echo "APK: $(stat -c %s "$apk") bytes, sha256 $(sha256sum "$apk" | cut -d' ' -f1)" | tee -a "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: android
          if-no-files-found: error
          compression-level: 0
          path: godot/build/android/CrazyLegsMundellRampage.apk

  web:
    name: Browser build and landing page
    needs: [earlier, lint, checks, window]
    if: >-
      ${{ !cancelled()
      && ((github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.builds))
      && (needs.earlier.outputs.passed == 'true'
          || (needs.lint.result == 'success' && needs.checks.result == 'success' && needs.window.result == 'success')) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/godot
        with:
          templates: "true"
          # main's caches are the ones every branch can restore.
          save-cache: ${{ github.ref == 'refs/heads/main' }}
      - name: Export the WebAssembly build
        run: |
          # The browsers' lighter copy of the art and music (assets_gen/lite):
          # tools/pack_lite.gd re-encodes the music with ffmpeg.
          command -v ffmpeg > /dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null; }
          godot --headless --path godot --script res://tools/pack_lite.gd 2>&1 | tee lite.log
          grep -q "LITE PACKS WRITTEN.*music re-encoded" lite.log
          mkdir -p godot/build/web godot/build/web-lite
          godot --headless --path godot --export-release "Web" build/web/index.html 2>&1 | tee export.log
          # The lighter build has no threads: it is what iPhones, iPads and any
          # browser that will not isolate the page are sent to (play/lite/).
          godot --headless --path godot --export-release "Web Lite" build/web-lite/index.html 2>&1 | tee -a export.log
          if grep -iE "export .*failed|SCRIPT ERROR" export.log; then exit 1; fi
          # Each chapter's own files (music, enemies, their models and sounds,
          # its own props) are left out of index.pck and fetched after the game
          # starts (src/pack_loader.gd), from packs beside it.
          godot --headless --path godot --script res://tools/make_packs.gd -- build/web 2>&1 | tee packs.log
          grep -q "PACKS OK" packs.log
          godot --headless --path godot --script res://tools/pack_check.gd -- quick lite build=build/web 2>&1 | tee -a packs.log
          grep -q "PACK CHECK OK" packs.log
          cp godot/build/web/packs.json godot/build/web/chapter_*.pck godot/build/web-lite/
          for build in web web-lite; do
            test -s godot/build/$build/index.wasm
            test -s godot/build/$build/index.pck
            test -s godot/build/$build/packs.json
            ls -lh godot/build/$build
          done
      - name: Assemble the Pages site
        run: |
          mkdir -p _site/play
          cp -r site/. _site/
          cp -r godot/build/web/. _site/play/
          mkdir -p _site/play/lite
          cp -r godot/build/web-lite/. _site/play/lite/
          godot --headless --path godot --script res://tools/version.gd | tail -n 1 > _site/version.txt
          du -sh _site
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: _site

  release:
    name: Publish GitHub release
    needs: [installer, android]
    if: ${{ !cancelled() && startsWith(github.ref, 'refs/tags/v') && needs.installer.result == 'success' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "{windows,android}"
          merge-multiple: true
          path: release
      - name: Flatten the downloads
        run: |
          find release -type f \( -name '*.exe' -o -name '*.apk' \) -exec mv -n {} release/ \;
          find release -mindepth 1 -type d -empty -delete
          ls -lh release
      # update.json: the version and each file's size and SHA-256. The game's
      # in-game Android update reads it from this release (releases/download/
      # vN/update.json) and checks the APK it downloads against it.
      - name: The release's update.json
        run: |
          set -euo pipefail
          cd release
          version="${GITHUB_REF_NAME#v}"
          {
            printf '{\n  "version": "%s",\n  "files": {\n' "$version"
            first=1
            for f in CrazyLegsMundellRampage.apk CrazyLegsMundellRampage_Setup.exe CrazyLegsMundellRampage.exe; do
              test -s "$f"
              [ "$first" = 1 ] || printf ',\n'
              first=0
              printf '    "%s": {"size": %s, "sha256": "%s"}' "$f" "$(stat -c %s "$f")" "$(sha256sum "$f" | cut -d' ' -f1)"
            done
            printf '\n  }\n}\n'
          } > update.json
          python3 -c "import json,sys; d=json.load(open('update.json')); assert d['version']==sys.argv[1] and len(d['files'])==3" "$version"
          cat update.json
      - name: Create or update the release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release/*
          fail_on_unmatched_files: true

  pages:
    name: Deploy GitHub Pages
    needs: [web]
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' && needs.web.result == 'success' }}
    concurrency:
      group: pages-deploy
      cancel-in-progress: false
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
