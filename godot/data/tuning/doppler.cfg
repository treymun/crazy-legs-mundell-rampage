; Doppler on fast movers (pass 14, src/doppler.gd, src/mover_sounds.gd,
; docs/dev/audio.md "Doppler (pass 14)"). Sound only: never the tick, the
; dice or a snapshot. A sound tied to something moving (a vehicle's engine,
; a race car or cruiser coming round, a shot's flight, a thrown thing's
; whoosh, a saucer's hum) is pitched by how fast it and the listener close
; or open the gap between them:
;     pitch = base * (c - v_listener . n) / (c - v_source . n)
; n the way from the source to the listener, c `sound_speed`, each speed
; times its family's `scale`; `base` is the cue's own pitch (the per-play
; spread, an engine's rate), so the two multiply. Speeds come from the drawn
; positions, frame to frame (what is drawn between ticks, online too).
;
; on           off: every sound keeps its own pitch
; sound_speed  c, cells a second. Real sound is about 40 times a car's top
;              speed; here 150 (about 11.5 times the stock car's 13), so a
;              car passing at speed goes up about 1.6 semitones and down 1.4
;              (a minor third in all): heard, never a cartoon
; most_up, most_down   the shift at most (semitones)
; ease         how fast the pitch follows (seconds to come most of the way)
; slew         and how fast it may move at most (semitones a second): no
;              zipper, no jump
; track        how fast a speed follows the drawn positions (seconds)
; snap         a jump farther than this between two frames (cells) is a
;              teleport (a respawn, a seat taken, a level): the speed is
;              forgotten there, never read from the jump
; fastest      a speed over this (cells a second) is not believed either
; shortest     a cue shorter than this (seconds) keeps its pitch: too short
;              to hear a sweep
; forget       a mover not seen for this long is let go (seconds); a sound
;              still playing keeps the pitch it had
[all]

on=true
sound_speed=150.0
most_up=3.0
most_down=3.0
ease=0.05
slew=30.0
track=0.06
snap=2.0
fastest=45.0
shortest=0.45
forget=0.5

; The flight loops (src/mover_sounds.gd): the nearest `slots` things in the
; air within `reach` cells each carry their loop (one voice each); the
; nearest saucer or probe within `hum_reach` its hum. A loop comes up over
; `fade_in` seconds and goes over `fade_out`; where it is heard from (the
; walls and floors between, Hearing) is looked at again every `hear_every`
; seconds, the pitch every frame. A whoosh (`whoosh` in [fly]) is as loud as
; the thing is fast: nothing at `quiet` cells a second, all of it at `loud`.
[loops]

slots=3
reach=14.0
hum_reach=11.0
fade_in=0.06
fade_out=0.1
hear_every=0.033
quiet=2.0
loud=8.0

; Each family: on, and scale (its speeds' share in the shift: 0 none, 2
; twice). A family's speeds may be scaled up where they are slow but should
; still be heard to bend (the saucers hover at under 2 cells a second).
[family.car]

on=true
scale=1.0

[family.airboat]

on=true
scale=1.0

[family.mower]

on=true
scale=1.5

; The speedway's race cars and the Moonshine Run's cruisers running laps.
[family.race]

on=true
scale=1.0

[family.rocket]

on=true
scale=1.0

[family.bolt]

on=true
scale=1.0

[family.ball]

on=true
scale=1.0

[family.cow]

on=true
scale=1.0

; Thrown: dynamite, kegs, cocktails, jars, pots, cans, the hands' wrenches,
; footballs and jugs.
[family.thrown]

on=true
scale=1.0

; A thing carried and thrown (carry.cfg).
[family.carried]

on=true
scale=1.0

[family.saucer]

on=true
scale=3.0

; A shot's flight loop by its shots.cfg kind: [cue, level, pitch, family,
; whoosh]. `pitch` is the loop's own (a bolt's whoosh higher, a cow's lower);
; `whoosh` true: as loud as it is fast ([loops] quiet, loud).
[fly]

bottle_rocket=["fly_rocket", 0.8, 1.0, "rocket", false]
flare=["fly_rocket", 0.55, 1.2, "rocket", false]
bolt=["fly_whoosh", 0.55, 1.35, "bolt", true]
blade=["fly_whoosh", 0.5, 1.6, "bolt", true]
bowling=["fly_bowl", 0.75, 1.0, "ball", true]
cow=["fly_whoosh", 0.7, 0.75, "cow", true]
tnt=["fly_whoosh", 0.5, 1.0, "thrown", true]
keg=["fly_whoosh", 0.6, 0.8, "thrown", true]
shine_cocktail=["fly_whoosh", 0.5, 1.1, "thrown", true]
flash_jar=["fly_whoosh", 0.45, 1.15, "thrown", true]
smudge_pot=["fly_whoosh", 0.45, 0.95, "thrown", true]
firecracker_can=["fly_whoosh", 0.45, 1.1, "thrown", true]
king_dynamite=["fly_whoosh", 0.5, 1.0, "thrown", true]
wrench=["fly_whoosh", 0.45, 1.25, "thrown", true]
football=["fly_whoosh", 0.45, 1.2, "thrown", true]
fair_bottle=["fly_whoosh", 0.4, 1.2, "thrown", true]
tire=["fly_bowl", 0.5, 1.3, "ball", true]

; A carried thing thrown (carry.cfg): its loop as [fly] says.
[carried]

loop=["fly_whoosh", 0.55, 0.9, "carried", true]

; The saucers' hum (enemies.cfg brain "saucer": the saucers and the probes).
[saucer]

loop=["saucer_hum", 0.6, 1.0, "saucer", false]
