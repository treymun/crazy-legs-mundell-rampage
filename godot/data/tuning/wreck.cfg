; How the real pieces of broken things move, rest, knock and sound
; (src/wreck_physics.gd, src/features/wreckage.gd; looks only: own dice,
; never carried, saved or in anyone's way). Godot ConfigFile text: keep each
; value's form (2.0, not 2).
;
; [stuff.<name>] what a piece is made of (breakables.cfg `stuff`; a name not
; here is wood). `like` starts from another stuff's numbers.
;   dense    weight for its size (kg a cubic cell)
;   bounce   share of a hard landing's speed kept off the floor
;   grip     friction on the floor and on other pieces
;   roll     spin lost a second lying on the floor (round things: rolling
;            resistance)
;   slide    slide lost a second on the floor
;   cue      the sound of a knock; cue_hard of a hard one (a knock of `loud`
;            cells a second or more is heard full, half that is hard);
;            pitch is raised for small pieces; spin_cue a round piece of it
;            wobbling down on its rim (a hoop, a lid); alts other takes of
;            cue, one of them or cue picked at random each knock
;   crack    a knock this hard cracks it (WreckPhysics.cracked: the breaks may
;            split it; 0 never)
;   burst    how fast its pieces part from one another when it breaks
;   sinks    it goes under in water (else it floats)
[stuff.wood]
dense=500.0
bounce=0.3
grip=0.55
roll=2.2
slide=1.0
cue="wreck_wood"
cue_hard="wreck_wood"
alts=["wreck_wood_alt", "wreck_wood_alt2"]
loud=5.0
crack=7.5
burst=0.9
sinks=false

[stuff.grey]
like="wood"

[stuff.char]
like="wood"
dense=300.0
bounce=0.15
crack=4.0

