; [form.<name>] how a piece's shape changes that (breakables' cuts name a
; piece's form; a name not here, or none, is a plain box). A disc, a ring or
; a can is round: it touches by the lowest points of its rims, so it rolls
; and wobbles down like a coin. Each number is a factor on the stuff's.
;   bounce, grip, roll, slide
;   drag     a flat piece's air resistance on its face (a sheet flutters
;            down and sails; cells a second lost a second at a cell a second)
[form.board]
roll=0.8

[form.stave]
roll=0.8

[form.ring]
bounce=1.2
roll=0.55
slide=0.25

[form.disc]
roll=0.6
slide=0.3

[form.can]
roll=0.3
slide=0.3

[form.shard]
bounce=0.6
grip=1.3
roll=1.8
slide=2.2

[form.chunk]
bounce=0.8
roll=1.3

[form.sheet]
roll=1.0
drag=1.6

[form.clump]
bounce=0.2
roll=2.0
slide=2.0

; How a knock moves the pieces (WreckPhysics.impact): a shot, a break, a
; blast, a boot, a vehicle, a hard landing.
;   reach    distance from the hit at which a piece gets half the push
;   along    share of the push along the hit's way; out the share straight
;            away from the hit point; lift the share upward
;   spread   how far the way of each piece's push is turned at random
;   spin     random spin added (radians a second at full push)
;   most     the most speed any one piece gets (cells a second)
;   hidden   share kept by a piece the hit cannot see (a blast behind a wall)
; A shot's strength is an impulse (light pieces fly, heavy ones nudge); the
; others' strength is a speed.
[impact.shot]
reach=0.25
along=1.0
out=0.35
lift=0.45
spread=0.25
spin=2.0
most=7.0
hidden=0.0

[impact.break]
reach=0.28
along=0.9
out=0.7
lift=0.85
spread=0.35
spin=6.0
most=7.0
hidden=1.0

[impact.blast]
reach=1.4
along=0.0
out=1.0
lift=0.75
spread=0.3
spin=9.0
most=13.0
hidden=0.2

[impact.kick]
reach=0.2
along=1.0
out=0.6
lift=0.6
spread=0.4
spin=4.0
most=4.0
hidden=1.0

[impact.ram]
reach=0.5
along=1.0
out=0.6
lift=0.9
spread=0.3
spin=8.0
most=11.0
hidden=1.0

; How a shot's strength (an impulse) comes from its damage, and how hard
; walkers kick: players, the county's hands, BLUE the hound, the vehicles.
[knock]
shot_push=0.12
shot_most=8.0
kick_player=0.8
kick_enemy=0.6
kick_hound=0.5
kick_ride=1.1
; Knock sounds: at most this many a second from all the pieces, and each
; piece at most one in `gap` seconds; a knock under `quiet` cells a second
; is not heard.
sounds_most=9.0
gap=0.25
quiet=1.1
