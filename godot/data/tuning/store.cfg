; The 5v5 round modes' money, store and gun feel (src/modes/tactical_shop.gd
; reads it). Guns are named by their weapons.cfg section. Change the numbers
; here, not in the script; a match started after the change uses them.
;
; [economy]: everyone starts a half with start_money and can hold max_money;
; the team that takes a round gets win_reward (objective_reward when it was
; the bomb going up, the fuse cut or a hostage got out); the team that loses
; gets loss_base, loss_step more for every loss in a row before it, at most
; loss_max; attackers who lose after planting get plant_team_bonus each; the
; planter, the defuser and a rescuer get their own bonus; vest is what a vest
; stops of a hit (see [hit]).
[economy]
start_money=800
max_money=16000
win_reward=3250
objective_reward=3500
loss_base=1400
loss_step=500
loss_max=3400
plant_team_bonus=800
plant_reward=300
defuse_reward=300
hostage_take_reward=150
rescue_reward=1000
vest=100
kill_default=300

