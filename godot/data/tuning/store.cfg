; [blast]: a blast on another player, by the shot's kind: times what the
; level's blast does to a player, the default, and the part a vest lets
; through.
[blast]
tnt=3.2
bottle_rocket=3.0
bolt=3.0
arm_bolt=0.6
default=2.0
through=0.6

; [spread]: accuracy on the move: the spread (radians, each way) a gun of
; each kind gains at a full run (run_speed cells a second), from nothing
; under still_below; air adds in the air; crouched and still times crouch; a
; scoped sniper rifle gains scoped times its kind's.
[spread]
PISTOL=0.028
SMG=0.02
SHOTGUN=0.02
SPRAYER=0.015
RIFLE=0.05
MACHINE_GUN=0.065
SNIPER=0.07
HEAVY=0.0
still_below=0.9
run_speed=3.85
air=0.08
scoped=1.6
crouch=0.7
