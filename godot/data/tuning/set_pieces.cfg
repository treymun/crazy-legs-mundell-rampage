; The big breaks (src/features/set_pieces.gd, shapes in src/set_piece_shape.gd):
; barns and hay sheds that come down in big pieces when their posts go or a
; truck rams them, water towers that go over and flood the street, and fuel
; lines from the pumps that leak a trail of gas a fire runs along. A level
; lists its own in "set_pieces" (a plan's meta "set_pieces": [{"kind", "id",
; "x", "y", "turn" (quarter turns), the kind's own}]: docs/dev/levels.md).
; Play: game.rng and the game's own arithmetic, carried in snapshots, saved
; (what came down stays down). Godot ConfigFile text: keep each value's form.

[all]

; Levels where nothing here stands (the versus maps keep their cover).
never=["grainyard", "holler", "salvage", "pumpngo", "pineacres", "landing", "hub"]
; Falling: gravity (cells a second a second) and how long a hinged piece
; (a wall going over, a post, a whole tower) takes to go flat.
gravity=14.0
hinge_time=1.15
; The warning: the creak and the dust sifting down before it goes, and how
; far round it the county's hands run from it (cells past its footprint).
warn=0.95
flee=2.2
; A piece coming down on somebody: the hurt by what it is, and how long a
; player is pinned under it (Player.knocked) or a hand held (stun).
crush_roof=26.0
crush_wall=30.0
crush_beam=34.0
crush_post=18.0
crush_tower=70.0
crush_tank=90.0
pin=1.6
pin_enemy=2.4
; Hands take this many times the hurt (a lure under a barn pays).
enemy_crush=1.6
; What lies about after: a piece lower than `low` over the floor is stepped
; over (no cover); the rest is cover in the way of bodies and shots.
low=0.24
; Rubble's hurt to whoever stands where a lying piece would go: kept out of
; the cover (nobody is shut inside it).
; A blast's damage to the frame, as a share of its strength at its middle,
; and a ram's (a vehicle's knock on a post or a wall).
blast_frame=0.9
ram_frame=0.6
; Fire in the footprint eats the frame of a wooden one, a second per cell
; burning, and the legs or posts standing in a burning cell.
burn_frame=6.0
burn_part=9.0
burn_every=0.5
; Shots: how near a shot's line must pass a part's box (cells).
ray_pad=0.02

; A pole barn or hay shed: posts down both long sides, a top plate on each,
; a ridge beam, two slopes of tin sheets, plank walls on the sides `walls`
; names (back, left, right; the front stays open). Its posts bear the roof:
; `strain` of the frame goes with each post, and it comes down at none left
; (or `posts_out` posts gone). A wall panel shot to `crack` of its hp shows
; its tile's _hit boards and at none goes over on its own: a way in.
[barn]

w=8.0
d=5.0
eave=2.9
rise=1.1
posts=4
sheets=4
walls=["back", "left", "right"]
wall_tile="barn"
roof_tile="tin"
post_tile="wood"
beam_tile="wood"
frame=100.0
post_hp=60.0
strain=34.0
posts_out=2
panel_hp=55.0
crack=0.55
heard=12.0
call="SHE'S COMIN' DOWN!"

; A water tower on four timber legs braced both ways, a plank deck, a stave
; tank with iron hoops and a tin cap. Two legs out on one side (or the frame
; blasted to nothing) and it goes over that way: whatever is in its lane is
; flattened, the tank bursts where it strikes and the water floods the
; street (`flood` cells at most, `flood_speed` cells a second, standing
; `flood_life` seconds, then draining in `drain`).
[tower]

spread=1.15
legs=4.6
tank_r=1.55
tank_h=2.3
cap_rise=0.9
staves=18
leg_tile="wood"
tank_tile="wood"
hoop_tile="mill_tin"
cap_tile="tin"
deck_tile="porch"
frame=120.0
leg_hp=70.0
strain=45.0
legs_out=2
topple_time=2.1
heard=18.0
call="LOOK OUT BELOW!"
flood=110
flood_speed=7.0
flood_life=14.0
drain=4.0
; The flood's push (cells a second) and knock where its front meets a body,
; its hurt, and a hand held floundering.
wash=4.5
wash_hurt=6.0
wash_knock=0.7
wash_stun=1.6

; A fuel line: the pump island's pumps and a pipe run along the ground to
; where the level ends it (the tanks, the drums, the hay). A pump or a length
; of pipe shot through (`pipe_hp`, `pump_hp`) or blasted leaks: gas runs
; along the line both ways from the hole at `leak_speed` cells a second and
; lies `gas_life` seconds. Fire touching any of it (a blast, a fire, a burn
; barrel) lights it, and the fire runs along the gas a cell every `run_step`
; seconds, burning `gas_burn` seconds a cell: whatever stands at the end
; (a propane tank, the drums, hay) goes up: each cell lighting flares
; `flare` into whatever breakable stands on it.
[fuel]

pipe_hp=20.0
pump_hp=45.0
pipe_tile="mill_tin"
leak_speed=3.5
gas_life=60.0
run_step=0.09
gas_burn=4.5
flare=30.0
hiss_every=0.6

; How they come apart (looks only: src/set_piece_wreck.gd, never play). Each
; part is drawn in its own pieces that ride it and break away: `detail` how
; finely (a phone or the LOW tier takes `detail_low`), `early` the share of a
; part's pieces that break away in the fall rather than where it lands (more
; where it was weak: shot, near a post shot out, a blast, fire), `kick` how
; hard they are thrown, `sway` how far the frame leans in its creak
; (radians). Where a part lands most of its pieces jump and drop back into
; their places askew (the pile keeps the part's layers and its cover);
; `scatter` of them are thrown off onto the pile instead, and `propped` of
; those end up propped on it, one end on the ground. Dust billows and splinters at most (`puffs`, `specks`, fewer on
; a phone), and how far off a fall shakes the view (`shake_reach` cells).
[looks]

detail=1.0
detail_low=0.55
early=0.2
kick=1.0
scatter=0.4
propped=0.22
sway=0.03
puffs=30
puffs_low=12
specks=40
specks_low=16
shake_reach=26.0
