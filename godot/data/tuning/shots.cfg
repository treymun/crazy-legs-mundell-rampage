; Shots and blasts, read by src/shots.gd (and again within a second of saving,
; while the game runs from the project folder). One section a shot kind, as
; weapons.cfg's `shot` and the enemies' attacks name them; "fuel" is a burst
; fuel drum. Godot ConfigFile text: keep each value's form (2.8, not 2.8.0).
;
;   gravity     how fast it drops, cells a second a second (none: flies straight)
;   size        how big it is drawn (none: .14 an enemy's, .10 the player's)
;   rolls       it bounces, rolls and rests till its life runs out, as a
;               thrown stick of dynamite does (the 5v5 throwables)
;   glow        drawn full bright
;   explodes    it bursts where it stops, as a blast:
;
; A blast takes [blast] and changes what its own section sets:
;   radius      how far it hurts enemies and breaks things
;   strength    its damage at the middle (0: the shot's own damage)
;   energy      an alien burst: green flash, no fire, breaks no glass or drums
;   flash, duck the screen's flash and how long the music ducks
;   cue         its sound; also_sound, a second one (the cow's moo)
;   wake        how far away enemies hear it
;   player_damage  its most damage to the player, within 3/4 of the radius
;   opens_secrets  it blasts open the secret doors near it

[blast]

radius=2.8
strength=160.0
energy=false
flash=0.27
duck=1.1
cue="explosion"
wake=16.0
player_damage=30.0
opens_secrets=true

[tnt]

gravity=6.9
size=0.19
explodes=true

