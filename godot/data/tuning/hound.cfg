; BLUE, Mundell's bluetick coonhound (src/features/hound.gd, src/hound_legs.gd,
; src/hound_nose.gd, docs/dev/gameplay.md "The hound"). One a player in a campaign chapter, alone
; or in co-op, with HOUND DOG on. Distances in cells, times in seconds.

[hound]
; Health: a hound goes down at 0 and never dies. He mends `mend` a second
; after `mend_after` without a hurt; down, he gets himself up after `get_up`
; with `get_up_health`. A partner holding USE beside him for `revive_time`
; (within `revive_reach`) gets him up with `revive_health`; a pork rind
; (USE with rinds in the pocket) at once with `rind_health`.
health=100.0
mend=3.0
mend_after=6.0
get_up=40.0
get_up_health=35.0
revive_reach=1.4
revive_time=1.6
revive_health=60.0
rind_health=100.0
; Moving: his walk and his run (the player runs 3.85, 5.5 on moonshine), how far behind
; the player he heels and the distance he breaks into a run past; lost out
; of sight further than `lost_far` (or with no way to them) for `lost_for`,
; he turns up behind them.
walk=2.6
run=7.4
heel=1.5
heel_side=0.75
run_past=3.4
lost_far=24.0
lost_for=5.0
radius=0.22
; Keeping out of the line of fire: never in front of a player's sights
; closer than `clear_reach` within `clear_cone` (a cosine).
clear_reach=10.0
clear_cone=0.93
; His nose: how often he sniffs, how near a secret door or new iron must be
; for him to bay at it (`bay_for` seconds), how near the player must be,
; how near a pickup out of the player's sight for him to point at it, and
; how long his nose rests after a bay or a point (else he never shuts up).
sniff_every=0.5
bay_reach=7.0
bay_owner=11.0
bay_for=2.6
bay_rest=8.0
point_reach=8.0
point_for=3.0
point_rest=30.0
; Fighting: he goes for a hand within `sic_reach` (told, or on his own one
; under `pin_below` of its health within `fight_reach`), bites for `bite`
; each `bite_every` (never the last of its health: the kill is the player's),
; and once it is under `pin_below` drags it down and holds it `pin_time`
; (it cannot fight back or walk, only kick at him), then it kicks free.
; Not a boss nor kinds that fly. He does not start a fight under `brave` of
; his health.
sic_reach=16.0
fight_reach=8.0
pin_below=0.5
bite=7.0
bite_every=0.7
pin_time=5.5
pin_bite=2.0
brave=0.4
rest_after_fight=4.0
; The hands kick at him: one within `kick_reach` (the one he holds too) now
; and then (`kick_rate` a second), for `kick` health and a shove.
kick_reach=1.25
kick_rate=0.55
kick=11.0
kick_shove=0.5
blast_reach=3.5
blast=45.0
; Fetching: told, a pickup the player looks at within `fetch_reach`; on his
; own every `fetch_every` (to `fetch_every_more` more) when the player is
; under `fetch_hungry` health (food) or nearly out of the gun's rounds, one
; within `fetch_own_reach` the player cannot see.
fetch_reach=18.0
fetch_every=22.0
fetch_every_more=18.0
fetch_hungry=55.0
fetch_own_reach=12.0
; The whistle's look: how wide a cone the player's sights pick a hand or a
; pickup in (a cosine).
aim_cone=0.975
; Vehicles: one coming at him faster than `ride_from` (cells a second),
; within `ride_reach` ahead and its width beside, he jumps aside at
; `ride_hop` (never hurt); one on him shoves him out of its way. With his
; player at the wheel he heels behind the vehicle, `heel` past its tail.
ride_from=1.2
ride_reach=5.5
ride_hop=5.0
; Getting about (pass 10). His easy trot, the lope he ranges at beside a
; running player, and how fast he changes pace (cells a second each second).
trot=3.3
lope=5.4
accel=10.0
; Ranging: calm, at heel `range_rest` (to `range_rest_more` more) seconds,
; then out to a spot `range_near` to `range_far` cells from his player
; (`range_near_still` to `range_far_still` round one standing), between
; `range_side_min` and `range_side_max` radians off where they go, never in
; anybody's sights; there at most `range_for` seconds, he noses about
; `sniff_stop` (to `sniff_stop_more` more) and circles back to heel. Further
; than `catch_far` he runs back to heel.
range_rest=1.2
range_rest_more=2.4
range_near=4.0
range_far=8.0
range_near_still=2.0
range_far_still=4.5
range_side_min=0.45
range_side_max=1.1
range_for=4.0
sniff_stop=0.7
sniff_stop_more=1.3
catch_far=9.0
; In a player's sights (clear_reach, clear_cone) he steps aside, at least
; `aside_for` seconds.
aside_for=0.45
; Pathing: where he cannot walk straight he plans a way over the level's
; floor (doors as they stand, hazards and fire shut), out to `plan_reach`
; steps, again every `replan` seconds or when he stalls `stall_for`; stalled
; `unstick` where nobody sees, he hops on to the next step of his way. A
; lost dog (lost_far, lost_for) turns up `hide_near` to `hide_far` cells
; behind his player where nobody sees.
plan_reach=48
replan=2.0
stall_for=0.5
unstick=2.0
hide_near=2.5
hide_far=7.0
; Hazards: he keeps `harm_pad` cells clear of a saw, the chipper, a hot fence
; (hits.cfg [hazard]), fire, deep water, a twister, steam and chalk, the
; race's cars and a boss (`telegraph_reach` round where one winding up aims).
harm_pad=0.45
telegraph_reach=2.2
; Under `back_off` of his health he lets go of a fight and keeps behind his
; player, hurt, `back_off_for` seconds.
back_off=0.3
back_off_for=9.0
; Moods. A shot passing within `shot_near` cells of him: he sulks `sulk_for`
; seconds, trailing `sulk_heel` cells behind. A siren (a cruiser's within
; `siren_reach`, the twister's or the raid's anywhere): now and then
; (`howl_chance`, at most every `howl_rest`) he howls `howl_for`. A twister
; within its reach and `cower_reach` more: he cowers at his player's side. A
; hand awake within `growl_reach` his player cannot see: he growls at it
; `growl_for` (once a hand, at most every `growl_rest`). A still or scrap
; within `treat_reach`: he wags round it `treat_for`. Got up: he greets his
; helper `greet_for`.
shot_near=1.1
sulk_for=5.0
sulk_heel=2.8
; his walk while he sulks (his looks' walk, under 1.8)
sulk_pace=1.5
siren_reach=14.0
howl_chance=0.6
howl_rest=25.0
howl_for=2.6
cower_reach=6.0
growl_reach=9.0
growl_for=1.4
growl_rest=25.0
treat_reach=7.0
treat_for=2.6
greet_for=2.2
; With a free seat beside his player at the wheel (the airboat, the car) he
; gets in once he is within `board_reach` of its end, it going under
; `board_speed`, and rides along; else he follows behind.
board_reach=1.0
board_speed=2.5
