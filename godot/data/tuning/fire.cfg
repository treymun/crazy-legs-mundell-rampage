; Fire that spreads, read by src/features/fire.gd, and the moonshine stills
; (src/features/stills.gd). A blast of the kinds `lights` names, a shine
; cocktail's fire, a burning puddle of shine or a still's burning spray sets
; the cells it reaches alight; a cell burns as long as what is on it lasts
; (its floor, a prop, a body, a puddle: the sections below) and tries to light
; a neighbour now and then, so fire runs over a hay loft, a plank deck or a
; porch and stops at stone, dirt and water. Burnt out, a cell is charred and
; never burns again. Godot ConfigFile text: keep each value's form.

[all]

; Cells burning at once, at most; and how many more cells one fire may spread
; to (a new fire adds `budget_each`, up to `budget_most`), so it always ends.
cap=40
budget_each=60
budget_most=140
; A burning cell tries to light a neighbour every spread_every seconds (give
; or take a third): it catches by the neighbour's catch (below).
spread_every=0.75
; A cell set alight with nothing on it to burn (a blast on bare dirt) burns
; this long, long enough to catch what is beside it.
patch=1.6
; Every bite_every seconds what stands in a burning cell is burned: a player
; `bite`, an enemy `bite_enemy`, a breakable `bite_prop` (it breaks by its hp:
; a crate of dynamite in a fire goes up).
bite_every=0.5
bite=5.0
bite_enemy=9.0
bite_prop=7.0
; A body lying in a burning cell burns this much longer, once.
body=5.0
body_catch=0.4
; Rain (the level's rain in effects.cfg, the average of its spells when it
; comes in showers) on a cell under the sky: fire burns out this many times
; faster at full rain and catches this share as often.
rain_out=2.5
rain_catch=0.3
; The blasts that set what they reach alight (shots.cfg kinds), and the share
; of their radius they light.
lights=["keg", "fuel", "gas_can", "nitro", "still", "derby_blast", "king_dynamite"]
reach=0.55
; Puddles of spilled shine: at most, how long one lies before it soaks in,
; how long it burns once lit, and its size (cells across).
puddle_most=24
puddle_life=45.0
puddle_burn=6.0
puddle_size=0.8
; Charred cells drawn at most (the nearest), and how far off fire is heard.
char_drawn=160
heard=9.0

; The floors that burn, by tile: [seconds it burns, how readily it catches a
; neighbour's fire (0 to 1)]. A deck's own tile counts on the deck.
[floors]

hay=[5.0, 0.95]
hay_loft=[5.0, 0.95]
wood=[8.0, 0.45]
porch=[8.0, 0.45]
deck=[8.0, 0.45]
bayou_planks=[7.0, 0.4]
bayou_bridge=[7.0, 0.4]
bleachers=[8.0, 0.4]

; The props that burn where they stand, by picture: [seconds, catch]. One
; that breaks (breakables.cfg) is burned to pieces; the rest only char.
[props]

prop_hay=[7.0, 1.0]
town_range_hay_bale=[7.0, 1.0]
town_hay_wagon=[10.0, 0.9]
town_scarecrow=[6.0, 0.9]
town_sawdust_pile=[8.0, 0.9]
town_pallet_stack=[9.0, 0.6]
town_lumber_stack=[11.0, 0.5]
town_log_pile=[11.0, 0.4]
prop_crate=[7.0, 0.6]
prop_barrel=[7.0, 0.5]
town_mash_barrel=[7.0, 0.6]
town_range_ammo_crate=[6.0, 0.6]
town_tnt_crate=[5.0, 0.7]
town_picnic_table=[8.0, 0.5]
town_porch_couch=[8.0, 0.7]
town_camp_chairs=[4.0, 0.6]
town_rocker=[6.0, 0.6]
town_doghouse=[8.0, 0.6]
town_chicken_coop=[8.0, 0.6]
town_outhouse=[9.0, 0.5]
town_laundry=[4.0, 0.8]
town_crawfish_traps=[4.0, 0.4]

; What spills shine where it breaks (breakables.cfg pictures): puddles of it.
[spills]

town_jug_stack=1
town_mash_barrel=2
town_shine_tank=3
town_still=3
town_copper_vat=4

; The moonshine stills (src/features/stills.gd): breakables (breakables.cfg)
; that, shot and not yet broken, spray burning shine from the pipe the shot
; holed for `jet_life` seconds, `jet_reach` cells out (the spray lights what
; it lands on, `jet_bite` to whoever it hits every bite), and go up as a
; `still` blast (shots.cfg) when they break, throwing copper and burning
; puddles about.
[stills]

images=["town_still", "town_copper_vat", "town_shine_tank"]
jet_life=3.5
jet_reach=2.6
jet_bite=7.0
jet_every=0.2
pieces=10
