; Weapon tuning, read by src/tuning.gd when the game starts (and again within
; a second of saving, while it runs from the project folder). One section a
; gun, named as in Weapons.NAMES; [all] holds the shared values. Godot
; ConfigFile text: 6 is a whole number and 6.0 is not, so keep each value's
; form. A key missing from a gun's section means the gun has none.
;
;   capacity        rounds a load holds (0: fed straight from the reserve)
;   reload_time     seconds to reload; fire_time  seconds between shots
;   max_reserve     most rounds carried; pickup_reserve  rounds a pickup gives
;   damage          hit damage (the shotgun: shotgun_damage a pellet in [all])
;   melee           [damage, damage when it lands square]
;   recoil, settle, retreat, view_rise, kick_hold  how the gun kicks and recovers
;   raise_depth     how far below the view it starts when drawn
;   shot_noise      how far the shot is heard, in map cells
;   view_scales     size in view (else [all] view_scale)
;   view_shift      Vector2 nudge in view, in screen pixels
;   muzzles         Vector3i(x, y, flash size) on the 320x120 gun picture
;   muzzle_style    [flash picture, flash aspect, smoke size]
;   reload_beats    when the reload's three sounds fall, as parts of the reload
;
; What each gun is (src/weapons.gd reads these into its tables):
;   label           its name when picked up or chosen
;   saved_capacity  its magazine before the ammo pool change (old saves)
;   cycle           hand-loaded: fire_time holds the shot and the open /
;                   eject / load / close poses
;   recovers        eases back after the kick; muzzle_flash  shows a flash
;   reload_sounds   the reload's three sounds; open_sound  opening it
; The sections stay in Weapons.NAMES order: saves and the number keys
; count guns by it.

