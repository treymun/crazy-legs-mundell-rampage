; Weapon tuning, read by src/tuning.gd when the game starts (and again within
; a second of saving, while it runs from the project folder). One section a
; gun, named as in Weapons.NAMES; [all] holds the shared values. Godot
; ConfigFile text: 6 is a whole number and 6.0 is not, so keep each value's
; form. A key missing from a gun's section means the gun has none.
;
;   capacity        rounds a load holds (0: fed straight from the reserve)
;   reload_time     seconds to reload; fire_time  seconds between shots
;   max_reserve     most rounds carried; pickup_reserve  rounds a pickup gives
;   damage          hit damage (the shotgun: shotgun_damage a pellet in [all])
;   melee           [damage, damage when it lands square]
;   recoil, settle, retreat, view_rise, kick_hold  how the gun kicks and recovers
;   raise_depth     how far below the view it starts when drawn
;   shot_noise      how far the shot is heard, in map cells
;   view_scales     size in view (else [all] view_scale)
;   view_shift      Vector2 nudge in view, in screen pixels
;   muzzles         Vector3i(x, y, flash size) on the 320x120 gun picture
;   muzzle_style    [flash picture, flash aspect, smoke size]
;   flash_art       the shader view's own flash (LIGHTS AND GLOW on): a
;                   style of tools/art/build_gun_fx_art.gd (fx_mf_<style>)
;   flash_size      its size, times the flash size in muzzles
;   reload_beats    when the reload's three sounds fall, as parts of the reload
;   [all] sway_turn, sway_strafe, sway_limit, land_dip  the gun's weight: how
;                   far (screen pixels) it trails a turn (per radian a second)
;                   and a strafe (per cell a second), at most sway_limit, and
;                   how far it dips on landing (VIEW BOB scales them all)
;   shake           how much a shot shakes the view (0 to 1; none if missing)
;   (features/feel.gd) The gun hangs on springs: the kick (recoil, retreat,
;   view_rise) springs back and settles in about `settle` seconds, with
;   spring_damp (else [all]'s) saying how much it overshoots (0.2 wobbles,
;   1.0 none); [all] sway_hz and sway_damp the same for the sway, the landing
;   dip and the jolt of being hit
;   penetrate       how much wall the round goes through to hit who is behind
;                   (src/penetration.gd: a cell of planks costs 1.0, tin 0.75,
;                   wire fence 0.25, brush 0.6; brick, stone, steel, logs stop
;                   it); penetrate_damage  the part of its damage it keeps
;   thrown          held and thrown as the dynamite is (its poses: idle, kick,
;                   throw, dry); shot_life its fuse
;   scope           ALT FIRE puts the scope up and down: the view closes in this
;                   many times (Player.scoped); scope_spread  the stray scoped
;                   (spread is then the stray from the hip)
;
; What each gun is (src/weapons.gd reads these into its tables):
;   label           its name when picked up or chosen
;   saved_capacity  its magazine before the ammo pool change (old saves)
;   cycle           hand-loaded: fire_time holds the shot and the open /
;                   eject / load / close poses
;   recovers        eases back after the kick; muzzle_flash  shows a flash
;   reload_sounds   the reload's three sounds; open_sound  opening it
; How it fires (src/weapons.gd Armory.fire):
;   fire="hitscan"   a bullet: range, width (how near it must pass), spread
;                    Vector2(across, up) it strays by; pair_spread  the two
;                    shots of a pair either side; heat_spread  more stray per
;                    unit of heat; climb, climb_heat, heat_gain  the muzzle's
;                    climb and the heat each shot adds; pressure  it interrupts
;                    a windup
;   fire="pellets"   a load of pellets: pellets, pellet_damage (else [all]'s
;                    shotgun_pellets and shotgun_damage), spread, range, width,
;                    spark_pellets  how many chip the wall
;   fire="projectile" a shot (shots.cfg): shot, shot_speed, shot_lift,
;                    shot_from "eye" or "floor" and shot_height above or below
;                    it, shot_reach  how far ahead it starts, shot_aimed  it
;                    follows the view's tilt, shot_life seconds (none: the shot's own)
;   fire="melee"     a swing: melee_range, melee_width, swing_at  seconds into
;                    the swing it lands
;   assist           aim assist helps it; auto_fire  touch auto fire may fire it
; The dynamite and the ripsaw's grind are their own code.
;
; The sections are the guns, in order: saves and the number keys count guns
; by it, so a new gun goes at the end (a section, its art gun_<name>_<pose>,
; and its sounds <name>, equip_<name>, dry_<name>).

