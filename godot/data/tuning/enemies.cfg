; Enemy tuning, read by src/tuning.gd when the game starts (and again within
; a second of saving, while it runs from the project folder). One section an
; enemy kind; [all] holds the shared values. Godot ConfigFile text: 60 is a
; whole number and 60.0 is not, so keep each value's form.
;
;   hp, speed (cells a second), radius and height (in cells), hostile
;   reach           how far it attacks from
;   comfort         the distance it likes to keep
;   windup          [seconds of warning before an attack, warning sound]
;   recovery_times  seconds it stands open after an attack
;   lunges          [wind-up, leap speed, bite range, damage, sound, cooldown]
;
; What each kind is (src/enemies.gd reads these into its tables):
;   brain           act as this other kind: a new enemy can take an existing
;                   one's behaviour and every value it does not set itself
;                   (its art is still <kind>_*.png)
;   title           a boss's name on the health bar; tell its attack warning
;   signature       [reach, stand-off, windup, recovery, cooldown, warning
;                   sound, release sound] of the yard crew's set attacks
;   cels            "turn": eight-way turning, a four-beat walk and falling
;                   cels; "tumble": two tumbling cels before it lies still
;   fidget          has idle fidget cels
;   voice           whose voice it cries with; struck "shell" or "tool": the
;                   sound a hit makes on it (otherwise cloth)
;   alert           the sound when it wakes; answers_losses: goes to look
;                   when one of its own falls; ranged: attacks from range
;   blood="plasma"  bleeds plasma, not gore; green_gibs: green chunks
;   drop, drop_chance  what it leaves when it falls, and how likely (1: always,
;                   even with NO DROPS; under 1: not with NO DROPS)
;   finale_drop     what a chapter's last boss leaves
;   swims           goes into deep water nobody else can (Gator Bayou), quick
;                   and low in water; lurks: squats in the water to the eyes
;                   until roused; calls_gators: wakes the gators near when it
;                   first sees the player (src/bayou_brains.gd)
;   [all] lucky_chance  how likely any common enemy leaves a random food or drink
;   [all] voice_takes   how many takes of each voice's cries there are
;   [all] death_only_voices   voices with only a death cry

