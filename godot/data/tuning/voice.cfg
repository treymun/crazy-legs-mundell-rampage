; Voice chat online (src/net/net_voice.gd routes and buffers it, the host
; and the lobby server forward it; src/net/voice_chat.gd records, plays and
; places it). Distances are cells, times milliseconds. Docs:
; docs/dev/multiplayer.md "Voice chat".

[voice]
; Past this nobody hears you (the server sends your voice to nobody
; farther off, so it costs nothing either).
radius=18.0
; Closer than this you are at full level.
full_within=3.0
; How fast a voice falls off past full_within (like a sound's, gentler).
falloff=0.11
; The last part of the radius fades to nothing (a share of it).
edge=0.25
; Voices one player is sent at once: the first ones talking keep their
; place, the next waits (each costs about 4 KB/s down).
heard_most=4
; Frames a talker may send a second (25 is real time) and in a burst: more
; is dropped by the server, so nobody floods the line.
frames_a_second=30
frames_burst=10
; The jitter buffer: frames held before a talker starts playing, or this
; long since their first frame came, and the most held (past it the oldest
; go, to catch up after a stall on a WebSocket).
start_frames=2
start_ms=90.0
most_frames=8
; How long after the last frame a talker still shows as talking.
talking_ms=260.0
; OPEN MIC: frames kept going after the voice drops below the gate, and the
; gate's level (dB under full) at MIC SENSITIVITY 0 and 100.
hangover_frames=8
gate_db_low=-28.0
gate_db_high=-58.0
; PUSH TO TALK: frames kept going after the key is let go.
release_frames=3
; How loud a voice is next to you at VOICE CHAT VOLUME 100.
level=1.15
; The radio's band (Hz): rumble under low_cut_hz goes; CB 8K keeps nothing
; past high_cut_hz, CLEAR 16K nothing past clear_top_hz (the s's, t's and
; f's live from 4 to 6.5 kHz; a radio's top still, not a hi-fi's).
low_cut_hz=120.0
high_cut_hz=3500.0
clear_top_hz=6500.0
; VOICE QUALITY's CLEAR 16K (docs/dev/multiplayer.md "Voice chat"): about
; 6.3 KB/s a voice against CB 8K's 4.3. This lobby takes it (an always-open
; server says so in its settings; false: everyone CB 8K).
clear_allowed=true
; Voices one listener gets CLEAR at once; the rest come CB 8K.
clear_heard_most=2
; The voices a lobby sends with CLEAR (KB/s, clear_heard_most counted):
; past this everyone gets CB 8K until it comes back under nine tenths of
; it. An always-open server's (ten talking at once is about 209, so it
; holds there; a bigger party line room falls back), and a player's own
; lobby's, sent from a home connection's upload (about six talking).
clear_lobby_kbs=240.0
clear_home_kbs=100.0
; A listener whose voices come late, lost or thrown this often (a share of
; them, judged every 2 s) takes and sends CB 8K for clear_rest_ms.
clear_trouble=0.12
clear_rest_ms=20000.0
