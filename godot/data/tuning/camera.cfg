; The cameras outside play and the quality tiers, read by src/photo_mode.gd,
; src/kill_cam.gd and src/core/quality.gd when their scripts load (a change
; shows at the next start). Godot ConfigFile text: 6 and 6.0 differ.

[photo]
; PHOTO MODE's free camera (P in play, Y on a pad's pause screen, PHOTO on
; a touch screen): cells a second it flies, and running.
speed=2.4
run_speed=6.0
; How far from the player it may fly (cells), and how close to a wall,
; floor or ceiling it may come.
reach=24.0
clearance=0.18
; The picture saved: the view's rows at this many times 320x156 (HD at twice
; that), each pixel a square block, so it stays crisp.
scale=4
; How long the bottom strip says where the picture went (seconds).
note_time=3.0

[kill_cam]
; How much of the view is kept to replay (seconds of game clock) and how
; often it is sampled (a second).
keep=3.0
rate=30.0
; The replay: from `before` seconds ahead of the kill to `after` seconds
; past it, at `pace` of real speed (0.5 is half speed), starting `delay`
; seconds after the kill once any slow motion is over.
before=1.6
after=0.7
pace=0.55
delay=0.7
; The camera: how far from the body (cells), how high over its floor, how
; far round it swings over the replay (radians), where it aims (of the
; body's height).
distance=2.7
height=1.05
swing=0.7
aim=0.45
; BOSSES AND AREAS: an area is cleared when no foe is left awake within
; `area` cells of the last one killed, after at least `fight` kills in the
; last `fight_time` seconds.
area=14.0
fight=3
fight_time=25.0

[quality]
; QUALITY AUTO on the first play: the frame's own work is measured for
; `measure` seconds after `settle` seconds of play, and the tier picked
; from its average (milliseconds): under `high_ms` HIGH, under `medium_ms`
; MEDIUM, else LOW. A phone or tablet never starts above `phone_top`
; (0 LOW, 1 MEDIUM, 2 HIGH).
settle=1.5
measure=3.0
high_ms=7.0
medium_ms=12.0
phone_top=1

[boss_end]
; A boss's fall as a short cinematic (src/boss_ending.gd; KILL CAM BOSSES
; or BOSSES AND AREAS). Real seconds: the view stays on the player's eye
; for `hold`, then flies out to its shot over `fly` (a dip to black instead
; when the way is walled off or longer than `fly_far` cells); the whole of
; it lasts `length` (a rematch `rematch_length`, the sheriff with Jerry still
; to come `short_length`), the last `end_fade` going to black (`skip_fade`
; when skipped, which any key does once `skip_after` has passed).
hold=0.22
fly=0.95
fly_far=16.0
length=4.6
rematch_length=5.2
short_length=3.2
end_fade=0.45
skip_fade=0.28
skip_after=0.3
; The card drops at `card_at`; the drained boss bar shows for `bar_time`.
card_at=1.15
bar_time=0.9
; The shot: `reach` times the boss's size away (between `near` and `far`
; cells), `lift` times its size over its floor, swinging `swing` radians
; round it while it eases back by `push` of its reach and cranes up to
; `crane` times its height; it aims at `aim_high` of the boss's height as
; the blow lands and `aim_low` once it lies.
reach=1.55
near=2.6
far=9.0
lift=0.42
swing=0.55
push=0.15
crane=1.8
aim_high=0.5
aim_low=0.25
; A boss's size where its height alone does not say it: a truck, Maw, and
; tighter for the boat (the King in it, not the lagoon round him) and for the
; sheriff and the Revenue Man, dark-coated and lying low.
size={ "derby_champ": 3.2, "swamp_king": 1.9, "maw": 4.6, "boss": 1.85, "revenue_man": 1.65 }
; The reach (cells) for a boss that lies small for its size: the King
; slumped in his boat, nearer than `near`.
close={ "swamp_king": 1.9 }
; The music under the boss's end sting (of its level), eased.
duck=0.22
