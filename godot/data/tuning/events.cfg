; County events (content pass 8, src/features/county_events.gd and
; src/event_*.gd; docs/dev/gameplay.md "County events"): a twister, a hog
; stampede, a revenue raid or a blackout that may happen once in a campaign
; chapter, picked with game.rng when the chapter starts. Distances in cells,
; times in seconds. The EVENTS setting (PLAY page): OFF, SOMETIMES, OFTEN.

[all]
; The chance a chapter gets one, SOMETIMES and OFTEN.
chance_sometimes=0.5
chance_often=1.0
; When it comes: this many seconds into the chapter at the least and most
; (OFTEN at `often_pace` of that), tried again every `retry` while it cannot
; start (a boss fight, a boss near, nowhere to put it, someone down).
start_after=Vector2(75, 230)
often_pace=0.6
retry=12.0
; Never within this far of a boss still standing, never in these levels.
boss_clear=26.0
never=["hub", "range", "mothership"]
; The kinds and how likely each (a blackout only where `night` lists the
; level; a raid only where there are hands to raid).
kinds=["twister", "hogs", "raid", "blackout"]
weights=[1.0, 1.0, 0.9, 0.9]
night=["hickston", "fair", "bayou", "speedway"]

[twister]
; The siren and the scanner, then it touches down `start_far` out and comes
; across at `speed`, passing `pass_near` to `pass_far` beside the player (or
; right through a barn or a tower within `aim_set_piece` of them), and lifts
; `lift` seconds after it leaves the far side.
warn=13.0
start_far=30.0
pass_near=2.5
pass_far=6.0
aim_set_piece=28.0
speed=1.25
wobble=1.6
lift=5.0
; Its core and its pull: within `reach` under the open sky a body is drawn
; round and in (`pull` cells a second at the core's edge, less further out;
; `swirl` of it round), in the core thrown about and hurt `bite` a second
; (`bite_enemy` for the hands), knocked flat `knock`. Under a roof nobody is
; touched: seek cover.
core=1.7
reach=7.5
pull=3.4
swirl=0.65
bite=11.0
bite_enemy=34.0
knock=1.1
; What it breaks: a breakable within `core` + `smash` takes `smash_hp` a
; second; a set piece's parts within `core` + 1 take `rip` every `rip_every`;
; loose things within `reach` are torn off and flung (`fling` cells a second,
; `fling_up` up), `fling_most` at once.
smash=0.6
smash_hp=160.0
rip=70.0
rip_every=0.35
fling=7.5
fling_up=5.5
fling_every=0.4

[hogs]
; A herd of razorbacks: `count` hogs bunched `spread` wide come down an open
; run at least `run_least` long that passes within `pass_near` of the player,
; at `pace` (the player runs 3.85), and are gone out of sight past its end.
count=11
spread=2.2
run_least=18.0
run_most=44.0
pass_near=4.0
pace=4.4
radius=0.3
warn=3.0
; Trampled: a player in a hog's way takes `trample` and lies `knock`; a hand
; `trample_enemy` and a stun; a breakable `bowl` (knocked over, broken); a
; blast within `blast_reach` kills a hog.
trample=9.0
trample_enemy=22.0
knock=1.0
stun=1.4
bowl=60.0
blast_reach=2.6
; At most this long, then whatever is left runs off out of sight.
most=40.0

[raid]
; Revenue men: `count` (`count_hard` on HARD and up) of the first kind in
; `kinds` the game has come out of the player's sight `come_from` away from a
; still (or the county's hands' gathering) and storm it, fighting the hands
; and the player. The Moonshine Run's revenooers (suits, mirrored shades,
; their snub .38s) are the squad; their pictures are in the base pack for it.
kinds=["revenooer", "yard_deputy", "shield_deputy"]
count=4
count_hard=6
come_from=Vector2(12, 22)
warn=5.0
; Their guns at range on the county's hands (the hands answer in kind):
; `shot_every` (to `shot_more` more), `hit` within `aim_far` (less further),
; the hurt.
shot_every=0.75
shot_more=0.55
aim_far=12.0
hit=0.55
hurt=13.0
; The still: struck `bust` once they stand within `bust_reach` of it.
bust=400.0
bust_reach=2.4
most=170.0

[blackout]
; The lights go out in a night chapter: the lamps, signs and lit windows
; (`dark` of the light gone), every player gets a flashlight; the power
; comes back after `back_after` (least, most) or at the main breaker,
; `breaker_far` (least, most) from the player.
dark=0.8
fade=1.4
back_after=Vector2(110, 170)
breaker_far=Vector2(8, 26)
; The flashlight: its battery (seconds of light), what a second off gives
; back, the share where it starts to flicker; its beam.
battery=95.0
rest=0.3
flicker=0.2
beam_reach=11.0
beam_cone=0.42
; The hands in the dark see the player `dark_sight` as far, but `lit_sight`
; as far when the flashlight is on; `lanterns` of the hands carry a lantern
; (they see as ever, and are seen).
dark_sight=0.55
lit_sight=1.25
lanterns=0.4
; With the power out the sky still lights the edges of what stands in the
; dark (the moon's rim, effects.cfg): this much more of it, at full dark.
moon_rim=0.5
