; The online lobby's settings (src/net/net_play.gd reads them): each row is
; [key, label, the values it takes, what each value is called]. A new choice
; goes in its row's two lists; a new online mode goes in the mode row (and
; NetPlay.play_mode()). The store rules' row takes store.cfg's [rules.*].

[lobby]
lobby_rows=[["max_players", "ROOM FOR", [2, 4, 6, 8, 10], ["2", "4", "6", "8", "10"]], ["late_join", "LATE JOIN", [true, false], ["ON", "OFF"]], ["pick_teams", "TEAMS", [true, false], ["PLAYERS PICK", "HOST BALANCES"]], ["chatter", "CHATTER", [2, 1, 0], ["EACH'S OWN", "CLEAN AT MOST", "OFF"]]]
match_rows=[["mode", "MODE", ["bomb", "hostage", "tagteam", "county"], ["SEARCH AND DESTROY", "HOSTAGE RESCUE", "TAG TEAM 2V2", "COUNTY RUN CO-OP"]], ["map", "MAP", ["grainyard", "holler", "salvage", "pumpngo", "pineacres", "landing", "county_hickston", "county_quarry", "county_bayou"], ["GRAIN CO-OP", "DISTILLERY", "SALVAGE", "2V2 PUMP 'N GO", "2V2 PINE ACRES", "2V2 LANDING", "RUN: HICKSTON", "RUN: THE QUARRY", "RUN: GATOR BAYOU"]], ["store_rules", "RULES", "store", "store"], ["rounds", "ROUNDS TO WIN", [3, 4, 5, 7, 9, 10], ["3", "4", "5", "7", "9", "10"]], ["team_size", "TEAM SIZE", [1, 2, 3, 4, 5], ["1V1", "2V2", "3V3", "4V4", "5V5"]], ["bots", "BOTS FILL", [true, false], ["ON", "OFF"]], ["bot_skill", "BOT SKILL", [0, 1, 2, 3, 4], ["EASY", "NORMAL", "HARD", "HOG WILD", "MIXED"]], ["friendly_fire", "FRIENDLY FIRE", [false, true], ["OFF", "ON"]], ["round_seconds", "ROUND TIME", [0.0, 60.0, 90.0, 120.0, 150.0, 180.0], ["MODE'S", "1:00", "1:30", "2:00", "2:30", "3:00"]], ["buy_seconds", "BUY TIME", [10.0, 15.0, 20.0, 30.0, 45.0], ["10 S", "15 S", "20 S", "30 S", "45 S"]], ["freeze_seconds", "FREEZE TIME", [3.0, 6.0, 10.0, 15.0], ["3 S", "6 S", "10 S", "15 S"]], ["start_money", "START CASH", [800, 1600, 4000, 10000, 16000], ["800", "1600", "4000", "10000", "16000"]]]
; What a new lobby starts with.
defaults={"lobby_name": "MUNDELL'S LOBBY", "password": "", "max_players": 10, "late_join": true, "pick_teams": true, "chatter": 2, "mode": "bomb", "map": "grainyard", "rounds": 7, "team_size": 5, "bots": true, "bot_skill": 1, "friendly_fire": false, "round_seconds": 0.0, "buy_seconds": 20.0, "freeze_seconds": 6.0, "start_money": 800, "store_rules": "any"}
