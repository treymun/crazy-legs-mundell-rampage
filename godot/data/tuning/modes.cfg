; The game modes' rules (src/modes/*.gd read it). Seconds unless named.

; Versus between players: a player's hit on another counts this much of what
; it does to the county's hands.
[versus]
pvp_scale=0.5

; Co-op: reviving a downed partner (reach in cells, seconds held, health
; given), coming back alone after respawn_after with respawn_health, the share
; of a partner's blast that lands. scale: players -> [hands' health x,
; bosses' health x, a partner beside every n-th hand at the start (0 none)].
[coop]
revive_reach=1.3
revive_time=3.0
revive_health=35
respawn_after=20.0
respawn_health=50
friendly_blast=0.5
scale={1: [1.0, 1.0, 0], 2: [1.25, 1.6, 3], 3: [1.5, 2.2, 2], 4: [1.75, 2.8, 1]}

; Deathmatch: back after respawn_delay, pickups back after pickup_back, the
; frag limit and the time limit.
[deathmatch]
respawn_delay=3.0
pickup_back=20.0
frag_limit=10
time_limit=300.0

; The 5v5 rounds: rounds to win, the freeze, the buy window after it, the
; share of a teammate's hit that lands with friendly fire on, how near the
; spawn a buy is, the pause after a round, how long the kill feed shows a
; line, a round's length (search and destroy and hostage rescue below).
[tactical]
rounds_to_win=7
freeze=6.0
buy_window=20.0
friendly_share=0.4
buy_reach=7.5
post=5.0
feed_seconds=5.0
round_seconds=105.0

; Search and destroy: planting and defusing (seconds, with wire snips),
; reaches, the fuse and the blast (radius in cells, damage at its heart).
[bomb]
plant_time=2.6
bomb_timer=35.0
defuse_time=7.0
snips_time=3.5
defuse_reach=1.25
pick_up_reach=0.75
blast_radius=10.0
blast_heart=420.0
round_seconds=105.0

; Hostage rescue: how near a hostage is picked up, how far behind it walks,
; a round's length.
[hostage]
carry_reach=1.5
carry_gap=0.55
round_seconds=115.0

; TAG TEAM 2V2 (search and destroy two a side): players, and the match's own
; rules over the 5v5's.
[tagteam]
players=4
rounds=9
round_seconds=90.0
buy_seconds=15.0

; COUNTY RUN's cards: weights of the spare slots of a level up (an upgrade for
; another carried gun, a new weapon, a perk), and how often a full set of
; slots still sees a weapon card.
[county_cards]
weights={"upgrade": 5.0, "weapon": 2.2, "perk": 2.6}
swap_chance=0.3

; COUNTY RUN co-op: the spawner's cap and the hands' health for each player
; past the first, coming back alone, the most in a party.
[county_coop]
cap_per=0.5
tough_per=0.35
respawn_after=25.0
respawn_health=50
most=4

; COUNTY RUN, squads and idle life: what each script held (comments as
; they were there).

[county_moves]
; A varmint this tough or tougher counts for HEAVY HAND and CALLED SHOT.
tough=90.0
; Seconds after a crowd thins that BREAKAWAY still counts it as escaped.
escape=2.5
; How long MUDSLIDE slides.
slide=0.26
; The blast CHAIN REACTION sets off (shots.cfg [county_chain]).
chain="county_chain"

[county_orbs]
; Value at or past which an XP cap is silver, then gold.
silver=4
gold=12
; How high above the player's feet (or below) a pile can be and still count
; as on their floor.
same_floor=0.62
; Seconds a supply lies before it goes.
supply_life=60.0
; Seconds a "+N" rises for.
pop=0.7

[county_spawner]
; How many open spots are tried for one spawn.
tries=28

[tactical_utility]
kinds=["flash_jar", "smudge_pot", "shine_cocktail", "firecracker_can"]
flash_reach=16.0
flash_most=4.6
smoke_life=15.0
smoke_radius=2.7
smoke_grow=1.4
fire_life=7.0
fire_radius=2.1
fire_bite=0.25
fire_damage=10.0
decoy_life=10.0
; The decoy's rhythm: the gaps between its shots, over and over.
decoy_gaps=[0.13, 0.13, 0.13, 0.9, 0.2, 0.2, 1.4, 0.13, 0.13, 0.7]

[squad]
; How far round the player (radians) a flanker swings before it closes in.
flank_swing=1.4
; Seconds between one bark of a moment and the next (any hand), and between
; any two barks at all.
moment_gap={ "spot": 1.6, "lost": 5.0, "search": 6.0, "help": 4.0, "flank": 5.0, "cover": 4.0, "brawl": 5.0, "idle": 7.0, "surprised": 1.5, "hurt_bad": 3.0, "regroup": 8.0 }
any_gap=0.7
own_gap=3.5

[squad_feature]
squad_step=0.4
; A squad: the alerted hands within this of the player.
near=18.0
; Seconds unseen before a throw flushes the player, and its wind-up.
gone_to_ground=2.5
flush_windup=0.85

[idle_life]
; Activity -> pieces of the names of things that start it. Earlier rows win
; a tie at the same distance.
by_things=[ ["probing", ["cow_tube", "specimen", "alien_console", "alien_crate", "saucer"]], ["watching", ["tv"]], ["cards", ["picnic_table", "boil_table", "table", "trophy"]], [ "drinking", [ "jug", "mash_barrel", "cooler", "ice_chest", "still", "bottles", "cancan", "cans", "jukebox", "backstock", "vending", "copper_vat", "soda" ] ], ["napping", ["porch_couch", "rocker", "bunk", "bathtub", "laundry", "couch"]], ["chopping", ["log_pile", "axe_stump", "lumber", "saw_blade", "pallet"]], ["feeding", ["hay", "feed", "giant_hog", "coop", "trough"]], [ "tinkering", [ "wreck", "pickup_truck", "engine", "tool_chest", "derby", "stock_car", "monster_truck", "dump_truck", "forklift", "outboard", "tire", "nitro_rack", "generator", "mine_cart" ] ], ["fishing", ["crawfish", "net_rack", "gator_hide", "cypress", "reeds"]], ["smoking", ["lamp", "lantern", "gas_cans", "propane", "utilitypole", "pump"]] ]
; How far from its place a thing may stand and still set the activity.
reach=2.6
; How much of its usual notice range a hand busy at each keeps (EASY; the
; harder the difficulty the nearer to all of it).
notice={ "napping": 0.45, "watching": 0.65, "cards": 0.7, "tinkering": 0.7, "probing": 0.7, "drinking": 0.75, "fishing": 0.75, "chopping": 0.8, "feeding": 0.85, "smoking": 0.9 }

[hit_zones]
; Shares of the body's height: the head is above HEAD_AT, the legs below
; LEGS_BELOW. In between, a hit further off the middle than ARM_OUT of the
; radius (ARM_SIDE seen side on, an arm toward the gun) is an arm.
head_at=0.8
legs_below=0.44
arm_out=0.62
arm_side=0.42
; What each kind holds that it can drop, as the picture of it lying there
; (fx_drop_<held>); the rest have nothing to drop.
held={ "clone": "long", "billy": "long", "coot": "pistol", "alien": "pistol", "barker": "tool", "millhand": "tool", "boilerback": "long", "yard_deputy": "pistol", "chain_hand": "tool", "valve_rat": "long", "drone": "tool", "pit_mechanic": "tool", "flagman": "tool" }
drop_chance=0.4
; Longest it goes without (it gives up looking and has it again), how long
; it stoops to pick it up, and its fists: damage, reach past its radius, and
; the time between swings.
drop_time=4.5
pick_time=0.45
punch=6
punch_reach=0.62
punch_time=1.05
; How far a wind-up's mark is thrown aside by an arm hit, in cells.
aim_throw=1.3
; One instant's damage that reels it further each step: [damage, stumble back
; in cells, flinch seconds, stun seconds].
reel=[[12.0, 0.04, 0.2, 0.0], [30.0, 0.09, 0.32, 0.0], [60.0, 0.15, 0.46, 0.22]]
; Shells of tin and steel: a hit sparks and clanks instead of bleeding. The
; boilerback only on the boiler on his back.
metal=["tin_guard", "drone", "saucer", "probe"]

[tactical_bot]

; The bots' buying ways, by slot: rifle carriers, the sniper, the one who buys
; an SMG rather than save, the one who likes a shotgun or big pistol.
styles=["rifle", "sniper", "rifle", "smg", "close", "rifle", "rifle", "smg", "close", "sniper"]
; Each bot's way of playing, by its place in its team (both teams alike):
; "aggressive" takes the entry, pushes a lost foe and falls back late;
; "careful" holds the angle, falls back early and re-peeks; "support" trades
; from further off and goes in between the two.
personas=["aggressive", "careful", "support", "careful", "aggressive"]
; By persona: health under which a bot in a fight falls back to cover; how
; long (s) it pushes toward a foe it lost before going back to its job.
fall_back={"aggressive": 22, "careful": 55, "support": 38}
push_lost={"aggressive": 4.0, "careful": 0.0, "support": 2.0}
; BOT SKILL MIXED (4): each bot's skill by its place in its team, both teams
; alike (0 EASY .. 3 HOG WILD).
mixed=[1, 2, 0, 2, 1]
; How far (cells) a teammate's death draws a bot to trade it, and for how
; long (s) it goes after where the killer was.
trade_reach=14.0
trade_for=6.0
; Seconds between one bot's radio lines, and a team's.
radio_gap=6.0
team_radio_gap=2.5

; The bots' aim (src/modes/bot_aim.gd), each by BOT SKILL: EASY, NORMAL,
; HARD, HOG WILD. reaction: seconds from a foe coming into view to the hand
; moving (times 0.8..1.35 a time, more off to the side and far away, a third
; for a foe seen moments ago); spring and damping: how fast the crosshair
; closes on where it means to aim (natural frequency a second) and how much
; it overshoots (under 1 overshoots); turn_most: radians a second at most;
; flick: the share of the first turn it lands off by; noise: how far (radians)
; the hand's aim point strays, re-picked every few tenths; track: the share
; of a moving foe's sideways motion the hand follows (the rest is lag);
; trigger: the cone (times the body's width) it fires inside; recoil: the
; share of a gun's kick it pulls down; burst: shots in a burst at range (it
; sprays up close) before resting; head: where it aims up the body (0 the
; feet, 1 the top of the head): the belly, so head hits come only from the
; hand straying high (docs/dev/modes.md: a person's share, not 60% of kills).
[bot_aim]
reaction=[0.36, 0.26, 0.2, 0.16]
spring=[7.5, 10.0, 12.5, 15.0]
damping=[0.5, 0.58, 0.66, 0.72]
turn_most=[7.0, 9.0, 11.0, 13.0]
flick=[0.4, 0.28, 0.18, 0.12]
noise=[0.05, 0.033, 0.022, 0.015]
track=[0.35, 0.55, 0.72, 0.85]
trigger=[1.8, 1.4, 1.15, 1.0]
recoil=[0.3, 0.5, 0.7, 0.82]
burst=[2, 3, 4, 5]
head=[0.28, 0.33, 0.38, 0.44]
; Extra stray: for every cell a second of the bot's own speed, of the foe's
; sideways speed, and the share added per 25 cells away; spray: the share
; added per shot in a burst (times 1 - recoil); rest: seconds between bursts.
move_noise=0.3
target_noise=0.15
far_noise=0.25
spray=0.18
rest=[0.22, 0.38]
; Inside spray_inside cells an automatic gun sprays; past it a pistol taps
; pistol_tap seconds apart at the least (0.04 less a skill step).
spray_inside=6.0
pistol_tap=0.34
; The first look: seconds added per radian off the middle of the view and per
; cell away; a foe seen again within memory seconds takes a third of the time.
notice_turn=0.1
notice_far=0.005
memory=1.5

[climbing]
; Ladders and ledges (src/climbing.gd): how fast the player and a hand go up
; or down a ladder (units a second); the highest ledge a body pulls itself up
; onto over the floor it stood on; how long a pull-up takes at the least and
; for each unit it rises; how long a step on or off a ladder's top takes; how
; fast a hand that walked off an edge falls, and how long the landing winds it.
ladder_speed=1.55
hand_ladder_speed=1.25
mantle_max=1.15
mantle_time=0.28
mantle_per=0.3
top_step=0.26
fall_gravity=9.2
landing_stun=0.3

[hand_tactics]
alert_ready=0.38
idle_ready=0.66
aim_commit=0.25
push_pace=1.23
; Smarter hands (src/hand_tactics.gd): seconds a reload takes, how far to the
; side of its cover a hand steps to peek out, and the wind-up of a door kick.
reload=1.8
peek_out=0.8
kick_windup=0.45

[marker]
; Trail markers (src/features/trail_marker.gd, pass 15): a chapter picked up
; from the last one after a death (BACK TO THE MARKER) instead of its start.
; One is taken on an objective (a station done, a key or task item taken, a
; vehicle run over, a boss down) and on first standing in a district, each
; once gap_least seconds have gone since the last, and gap_most seconds
; after the last whatever is going on (the ROOKIE's deaths ended unbroken
; fights of 103 to 137 s: a marker waiting for a quiet moment saved nothing).
gap_least=20.0
gap_most=45.0
; Taken only when it is safe enough: every player up, on the ground (not on
; a ladder, in deep water or a seat), no lit stick, not hurt for calm_for
; seconds, no awake hostile within clear_reach cells and no hostile shot in
; the air within shot_reach, no boss fight on or near, no set piece coming
; down, no vehicle run on. An objective's or a district's waits up to
; settle_most seconds for that, then leaves it to the clock.
calm_for=1.0
clear_reach=3.0
shot_reach=5.0
settle_most=10.0
; A clock's marker that has waited press_after for that is taken once
; nobody has been hurt for press_calm, hands about or not: the fights that
; killed the ROOKIE had a crawler within a step and a half the whole last
; minute of them, and the first cut's marker waited 81 s for a safe moment.
press_after=10.0
press_calm=0.5
; Dead again within bad_within seconds of coming back to a marker, the one
; before it is gone back to instead: nobody is stuck dying at a bad spot (the
; ROOKIE in the bayou cannery died 20.5 to 22.6 s after coming back, six
; times over, with 20).
bad_within=30.0
; Back at the marker each player has at least this much health, each gun
; carried at least these rounds in reserve (a marker can be taken mid-fight:
; the ROOKIE took 376 to 437 damage in those fights), and grace seconds
; before a hand that has not seen them yet takes notice.
health=50
rounds={ "revolver": 24, "shotgun": 12 }
grace=1.5
; First standing in a district takes one (false: objectives and the clock).
district=true

[par]
; The chapter end card's PAR (src/chapter_bests.gd, pass 15): seconds of the
; chapter clock, the same at every difficulty. Set from the SHARP bot at
; NORMAL (pass 15 audit, v3.12 content, seeds 1 and 2: hickston 259.6/261.2,
; fair 238.0/238.0, sawmill 199.6/205.6, quarry 216.8/196.4, bayou
; 247.2/225.6, speedway 175.6/186.4, moonshine 157.2/164.8, mothership
; 223.2/212.4), the mean times 1.5, to the nearest 5 s. The bot never
; explores; a person who knows the road makes it, a first run seldom does.
; T10 (the balance step, every pass 15 track in) set it again the same way
; from the long report's SHARP campaigns at NORMAL, seeds 1-3 (hickston
; 234.4/223.6/237.2, fair 274.0/232.4/243.6, sawmill 200.4/198.4/182.0,
; quarry 197.6/167.2/218.8, bayou 214.0/227.2/242.8, speedway
; 178.4/174.8/153.6, moonshine 137.6/143.2/129.6, mothership
; 195.2/216.8/191.2): the mean times 1.5 to the nearest 5 s. Moved: hickston
; 390 -> 350, fair 355 -> 375, sawmill 305 -> 290, quarry 310 -> 290, bayou
; 355 -> 340, speedway 270 -> 255, moonshine 240 -> 205, mothership 325 ->
; 300 (the Moonshine Run 21 % quicker: its crowds come to the player now).
chapters={
"hickston": 350.0,
"fair": 375.0,
"sawmill": 290.0,
"quarry": 290.0,
"bayou": 340.0,
"speedway": 255.0,
"moonshine": 205.0,
"mothership": 300.0
}
; The ribbon's share for keeping to par (the rest scaled to fit: kills .44,
; secrets .2, aim .16): full at par or under, none at slack times par.
pace_share=0.2
slack=2.0

[move]
; A player's walk (src/moves.gd, pass 15): cells a second walking and running,
; moonshine's sprint on top, the share kept wading and crouched.
walk=2.75
; 3.85 before pass 15: a touch quicker on the run.
run=4.1
sprint=1.42
water=0.69
crouch=0.51
; How fast the speed comes to what the keys ask, a second: a key held on
; the ground, none held (the stop), in the air.
; Before pass 15 the stop was 30 and the air 7: the stop now takes 63 % of the
; speed off in 25 ms (was 33), and the air steers half again as well.
ease_move=23.0
ease_stop=40.0
ease_air=10.0
; A jump's speed up and the fall's pull.
jump=2.7
gravity=9.2
; The slide (pass 15): CROUCH taken going at least slide_from on the ground
; starts one at slide_speed (or its own speed, if more), easing to the crouch
; walk over slide_for seconds; it turns toward the keys at most slide_steer
; radians a second and ends on a jump (a hop out of it), against a wall (less
; than slide_wall of its step made), on letting go of CROUCH or at its end;
; another waits slide_rest seconds.
slide_from=3.4
slide_speed=5.0
slide_for=0.55
slide_steer=1.6
slide_wall=0.5
slide_rest=0.8
