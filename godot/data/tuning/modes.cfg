; The game modes' rules (src/modes/*.gd read it). Seconds unless named.

; Versus between players: a player's hit on another counts this much of what
; it does to the county's hands.
[versus]
pvp_scale=0.5

; Co-op: reviving a downed partner (reach in cells, seconds held, health
; given), coming back alone after respawn_after with respawn_health, the share
; of a partner's blast that lands. scale: players -> [hands' health x,
; bosses' health x, a partner beside every n-th hand at the start (0 none)].
[coop]
revive_reach=1.3
revive_time=3.0
revive_health=35
respawn_after=20.0
respawn_health=50
friendly_blast=0.5
scale={1: [1.0, 1.0, 0], 2: [1.25, 1.6, 3], 3: [1.5, 2.2, 2], 4: [1.75, 2.8, 1]}

; Deathmatch: back after respawn_delay, pickups back after pickup_back, the
; frag limit and the time limit.
[deathmatch]
respawn_delay=3.0
pickup_back=20.0
frag_limit=10
time_limit=300.0

; The 5v5 rounds: rounds to win, the freeze, the buy window after it, the
; share of a teammate's hit that lands with friendly fire on, how near the
; spawn a buy is, the pause after a round, how long the kill feed shows a
; line, a round's length (search and destroy and hostage rescue below).
[tactical]
rounds_to_win=7
freeze=6.0
buy_window=20.0
friendly_share=0.4
buy_reach=7.5
post=5.0
feed_seconds=5.0
round_seconds=105.0

; Search and destroy: planting and defusing (seconds, with wire snips),
; reaches, the fuse and the blast (radius in cells, damage at its heart).
[bomb]
plant_time=2.6
bomb_timer=35.0
defuse_time=7.0
snips_time=3.5
defuse_reach=1.25
pick_up_reach=0.75
blast_radius=10.0
blast_heart=420.0
round_seconds=105.0

; Hostage rescue: how near a hostage is picked up, how far behind it walks,
; a round's length.
[hostage]
carry_reach=1.5
carry_gap=0.55
round_seconds=115.0

; TAG TEAM 2V2 (search and destroy two a side): players, and the match's own
; rules over the 5v5's.
[tagteam]
players=4
rounds=9
round_seconds=90.0
buy_seconds=15.0

; COUNTY RUN's cards: weights of the spare slots of a level up (an upgrade for
; another carried gun, a new weapon, a perk), and how often a full set of
; slots still sees a weapon card.
[county_cards]
weights={"upgrade": 5.0, "weapon": 2.2, "perk": 2.6}
swap_chance=0.3

; COUNTY RUN co-op: the spawner's cap and the hands' health for each player
; past the first, coming back alone, the most in a party.
[county_coop]
cap_per=0.5
tough_per=0.35
respawn_after=25.0
respawn_health=50
most=4

; COUNTY RUN, squads and idle life: what each script held (comments as
; they were there).

[county_moves]
; A varmint this tough or tougher counts for HEAVY HAND and CALLED SHOT.
tough=90.0
; Seconds after a crowd thins that BREAKAWAY still counts it as escaped.
escape=2.5
; How long MUDSLIDE slides.
slide=0.26
; The blast CHAIN REACTION sets off (shots.cfg [county_chain]).
chain="county_chain"

[county_orbs]
; Value at or past which an XP cap is silver, then gold.
silver=4
gold=12
; How high above the player's feet (or below) a pile can be and still count
; as on their floor.
same_floor=0.62
; Seconds a supply lies before it goes.
supply_life=60.0
; Seconds a "+N" rises for.
pop=0.7

[county_spawner]
; How many open spots are tried for one spawn.
tries=28

[tactical_utility]
kinds=["flash_jar", "smudge_pot", "shine_cocktail", "firecracker_can"]
flash_reach=16.0
flash_most=4.6
smoke_life=15.0
smoke_radius=2.7
smoke_grow=1.4
fire_life=7.0
fire_radius=2.1
fire_bite=0.25
fire_damage=10.0
decoy_life=10.0
; The decoy's rhythm: the gaps between its shots, over and over.
decoy_gaps=[0.13, 0.13, 0.13, 0.9, 0.2, 0.2, 1.4, 0.13, 0.13, 0.7]

[squad]
; How far round the player (radians) a flanker swings before it closes in.
flank_swing=1.4
; Seconds between one bark of a moment and the next (any hand), and between
; any two barks at all.
moment_gap={ "spot": 1.6, "lost": 5.0, "search": 6.0, "help": 4.0, "flank": 5.0, "cover": 4.0, "brawl": 5.0, "idle": 7.0, "surprised": 1.5, "hurt_bad": 3.0, "regroup": 8.0 }
any_gap=0.7
own_gap=3.5

[squad_feature]
squad_step=0.4
; A squad: the alerted hands within this of the player.
near=18.0
; Seconds unseen before a throw flushes the player, and its wind-up.
gone_to_ground=2.5
flush_windup=0.85

[idle_life]
; Activity -> pieces of the names of things that start it. Earlier rows win
; a tie at the same distance.
by_things=[ ["probing", ["cow_tube", "specimen", "alien_console", "alien_crate", "saucer"]], ["watching", ["tv"]], ["cards", ["picnic_table", "boil_table", "table", "trophy"]], [ "drinking", [ "jug", "mash_barrel", "cooler", "ice_chest", "still", "bottles", "cancan", "cans", "jukebox", "backstock", "vending", "copper_vat", "soda" ] ], ["napping", ["porch_couch", "rocker", "bunk", "bathtub", "laundry", "couch"]], ["chopping", ["log_pile", "axe_stump", "lumber", "saw_blade", "pallet"]], ["feeding", ["hay", "feed", "giant_hog", "coop", "trough"]], [ "tinkering", [ "wreck", "pickup_truck", "engine", "tool_chest", "derby", "stock_car", "monster_truck", "dump_truck", "forklift", "outboard", "tire", "nitro_rack", "generator", "mine_cart" ] ], ["fishing", ["crawfish", "net_rack", "gator_hide", "cypress", "reeds"]], ["smoking", ["lamp", "lantern", "gas_cans", "propane", "utilitypole", "pump"]] ]
; How far from its place a thing may stand and still set the activity.
reach=2.6
; How much of its usual notice range a hand busy at each keeps (EASY; the
; harder the difficulty the nearer to all of it).
notice={ "napping": 0.45, "watching": 0.65, "cards": 0.7, "tinkering": 0.7, "probing": 0.7, "drinking": 0.75, "fishing": 0.75, "chopping": 0.8, "feeding": 0.85, "smoking": 0.9 }

[hit_zones]
; Shares of the body's height: the head is above HEAD_AT, the legs below
; LEGS_BELOW. In between, a hit further off the middle than ARM_OUT of the
; radius (ARM_SIDE seen side on, an arm toward the gun) is an arm.
head_at=0.8
legs_below=0.44
arm_out=0.62
arm_side=0.42
; What each kind holds that it can drop, as the picture of it lying there
; (fx_drop_<held>); the rest have nothing to drop.
held={ "clone": "long", "billy": "long", "coot": "pistol", "alien": "pistol", "barker": "tool", "millhand": "tool", "boilerback": "long", "yard_deputy": "pistol", "chain_hand": "tool", "valve_rat": "long", "drone": "tool", "pit_mechanic": "tool", "flagman": "tool" }
drop_chance=0.4
; Longest it goes without (it gives up looking and has it again), how long
; it stoops to pick it up, and its fists: damage, reach past its radius, and
; the time between swings.
drop_time=4.5
pick_time=0.45
punch=6
punch_reach=0.62
punch_time=1.05
; How far a wind-up's mark is thrown aside by an arm hit, in cells.
aim_throw=1.3
; One instant's damage that reels it further each step: [damage, stumble back
; in cells, flinch seconds, stun seconds].
reel=[[12.0, 0.04, 0.2, 0.0], [30.0, 0.09, 0.32, 0.0], [60.0, 0.15, 0.46, 0.22]]
; Shells of tin and steel: a hit sparks and clanks instead of bleeding. The
; boilerback only on the boiler on his back.
metal=["tin_guard", "drone", "saucer", "probe"]

[tactical_bot]

; The bots' buying ways, by slot: rifle carriers, the sniper, the one who buys
; an SMG rather than save, the one who likes a shotgun or big pistol.
styles=["rifle", "sniper", "rifle", "smg", "close", "rifle", "rifle", "smg", "close", "sniper"]
