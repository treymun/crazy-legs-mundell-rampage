; Things a hand can pick up and throw, read by src/features/carry.gd. USE
; takes up a loose one the crosshair is on (nothing else to use there); FIRE
; throws it, ALT FIRE sets it down. It flies by tumble.gd, bounces, breaks if
; it is a breakable (data/tuning/breakables.cfg: a propane tank landing hard
; goes up), and what it strikes takes its weight in damage and a shove.
; Godot ConfigFile text: keep each value's form (2.0, not 2).

[all]

; How far off USE reaches a loose thing, and how wide round the crosshair
; (the dot of the facing and the way to it, per unit of distance).
reach=1.55
cone=0.55
; The tallest thing a hand takes up (cells).
tallest=1.45
; A throw: speed (cells a second) for a thing of weight 1, less for heavier
; (speed / sqrt(weight)), at most speed_most; the lift it is given and how
; much the view's tilt adds (per degree). A set-down's speed.
speed=7.6
speed_most=9.5
lift=1.7
tilt=0.045
drop=1.1
; What a thrown thing does to what it strikes: damage a unit of weight a unit
; of speed, at least hit_least; a shove (cells) a unit of weight a unit of
; speed, at most shove_most. Slower than hit_speed it does nothing.
hit=4.5
hit_least=8.0
hit_speed=2.2
shove=0.05
shove_most=0.7
; What a hard landing does to a breakable: damage a unit of weight a unit of
; speed at the moment it strikes a wall or the floor, from land_speed up.
land=6.0
land_speed=2.6
; Seconds a throw leaves its thrower alone (it starts inside their reach).
grace=0.25
; At most this many in the air at once (the oldest lands where it is).
flying_most=8

; The county's brutes take up a loose thing now and then and heave it at
; whoever they are after: the kinds that do, every `every` seconds each has
; `chance` to try (game.rng) when it can see them `near`..`far` away and a
; thing it can lift (weight at most `heaviest`) stands within `grab`; it holds
; it over its head `hold` seconds, then throws it at `speed`, `miss` the most
; it is off by (cells at the target). `harm` scales what it does to a player.
[brutes]

kinds=["billy", "big_billy", "millhand", "tough_bubba", "tough_earl", "tough_clem", "boilerback"]
every=1.0
chance=0.12
near=2.5
far=11.0
grab=1.7
heaviest=1.6
hold=0.7
speed=8.0
miss=0.9
harm=0.4

; One section a thing, by its whole picture (a board's image, or prop_<name>):
;   weight  how heavy (1: a crate); throws slower and hits harder by it
;   label   what USE says it is
;   cue     its knock landing (missing: impact_wood)
; A breakable (breakables.cfg) breaks by its own hp; anything else only
; bounces. Quest props, lit boards and anything parting two stretches of
; floor are never taken up, whatever is here.

