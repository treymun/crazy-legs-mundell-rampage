; The county's hazards: a man driven into one (a boot, a door kicked in, a
; finisher's punt) dies the way it kills. Found from the props the levels
; already stand (`images`), deep or running water and the hogs (within
; `hog_reach` of a live one). A hand walking about steps round them; only
; one driven in is caught. A boss takes `boss_share` of his health (at most
; once in `boss_rest` seconds) and is never killed outright.
[hazard]
images={"town_saw_blade": "saw", "town_headrig": "saw", "town_wood_chipper": "chipper", "town_bug_zapper": "zapper", "town_electric_fence": "fence", "town_burn_barrel": "barrel", "town_well": "well", "town_cattle_guard": "guard", "town_car_crusher": "crusher", "town_crusher": "crusher", "town_beam_emitter": "zapper"}
boss_share=0.18
boss_rest=4.0
hog_reach=3.5
water_ahead=0.45
water_least=2.0
; Reading them (pass 15, src/danger_marks.gd; looks): brackets breathe round
; each hazard within `show_reach` of an awake hand in the sights (the nearest
; within `sights_reach`), and a little skull shows under the crosshair when a
; boot now would slide him into one. A hazard kill pays a bonus (play, the
; same on every machine): COUNTY JUSTICE! on screen, `bonus_scrap` scrap
; with the bench on, a drop (the hand's own drop if his kind has one, else
; one of `bonus_drops` by game.rng; none with NO DROPS), and the
; hazard_killed event; `bonus_rampage` is what a RAMPAGE meter adds for one.
show_reach=3.5
sights_reach=12.0
bonus_scrap=3
bonus_drops=["shells", "bullets", "rinds", "whiskey"]
bonus_rampage=0.35

