; Reading danger (pass 15, src/danger_marks.gd, src/enemy_looks.gd,
; features/danger_looks.gd; looks only). DANGER ARROWS: a chevron at the
; view's edge toward each blow's source, fading over `arrow_for` seconds, at
; most `arrows_most` at once, doubled for a blow of `heavy` or more; an amber
; one toward each hand winding up off the view within `windup_reach` (the
; nearest `windups_most`). A hand's model flashes amber over the last
; `tell_share` of its wind-up; a wind-up of `big_windup` seconds or more marks
; the floor where it is aimed: `ring_dots` warning marks closing from
; `ring_wide` to `ring_tight` cells round the spot as it runs down (the
; bosses' ring), its middle filling. It is where the player stood as the
; wind-up began: a step aside and it is in front of him.
[danger]
arrow_for=0.8
arrows_most=4
heavy=20.0
windup_reach=14.0
windups_most=2
tell_share=0.6
big_windup=0.6
ring_dots=12
ring_wide=3.2
ring_tight=0.5
