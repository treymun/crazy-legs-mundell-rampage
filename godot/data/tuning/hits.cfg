; RAMPAGE (pass 15, features/rampage.gd; play, the same on every machine).
; Each kill of the player's own fills his meter (0 to 1) by `kill`, more for
; a head (`head`), an overkill that takes the body apart (`overkill`), a
; brawl finisher (`finisher`), a boss (`boss`) and a hazard kill ([hazard]
; `bonus_rampage`); each kill within `chain_for` seconds of the one before
; adds `chain` more for every link, up to `chain_most` links. It holds `hold`
; seconds after a kill and then drains `drain` a second. Full: RAMPAGE for
; `rampage_for` seconds (each kill in it adds `extend`, up to `rampage_most`
; in all): he moves `speed` times as fast and his hits do `damage` times as
; much. Alone, co-op (each player his own) and County Run; never in the
; versus modes, the hub or the range.
