; How hits land (src/hit_zones.gd, enemies.gd, game_state.gd read it). Keys
; are what hurt() is told did it (`how`): a gun's weapons.cfg name for a
; bullet or a swing, a shot's kind for what flies ("blade", "bowling",
; "energy").

