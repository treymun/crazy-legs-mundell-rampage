; is picked by the gun in hand (the lists; anything else is the boot's) and
; game.rng among its moves below; its blow lands `wind` seconds after the
; press, the hands are busy `hold`. Alone (SLOW-MO FINISHERS, as finishers.cfg
; above) the world slows to `pace` for `slowmo` real seconds. Bosses are
