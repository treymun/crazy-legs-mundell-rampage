name="SKULL CRACKED"
end="head_off"
zone="head"
how="crowbar"
cue="crowbar_hit"
gore=18
round=false

[finish.gut]
class="blade"
name="GUTTED"
end="gib"
zone="body"
how="slingblade"
cue="sling_hit"
gore=26
round=false

[finish.stomp]
class="boot"
name="BOOT TO THE FACE"
end="head_off"
