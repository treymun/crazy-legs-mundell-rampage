; Slow motion on a finishing shot (features/finishers.gd; SLOW-MO FINISHERS,
; alone only: never in co-op, versus, online or County Run co-op): the kill
; that leaves nobody fighting within `reach` cells (none still awake and
; after you, none near) slows the world to `pace` for `length` real seconds,
; eased in and out (game_state.gd slow_pace), at most once in `rest` seconds
; of play. A boss's fall keeps its own (bosses.cfg [boss_fight] slowmo).
[finisher]
length=0.6
pace=0.3
reach=14.0
rest=6.0
; (Pass 15.) Only after a fight of `fight_least` kills or more (a lone hand
; met alone no longer slows the world), `peak_length` real seconds when the
; kill ends the director's peak (features/director.gd).
fight_least=3
peak_length=0.8

; How a hit lands on the player's side (pass 15, PUNCH; game_world.gd struck,
; enemies.gd hurt, hit_zones.gd overkill, gore.gd, features/hit_reads.gd).
; The world holds (hitstop, alone only): `kill_hold` a kill, `boss_hold` a
; boss's, `hit_hold` a hit of `heavy_hit` or more, at most every `hold_gap`;
; a kill within `close_reach` cells by a load of `heavy_from` or more holds
; `close_hold`, the sawed-off within `point_blank` holds `sawed_hold` (and
; always takes the body apart); that close kill kicks the view (feel.gd punch,
; `kill_kick` of a blow's jolt). Every hit flinches at least `flinch_floor`.
; An overkill throws `gib_more` more chunks a share of its excess over the
; overkill line and each `gib_grow` bigger, up to `gib_most` times the lot.
; The shoves (the [reaction] shove, the reel, a hit of 20 or more) go by
; distance: `shove_near` times within `close_reach`, `shove_far` past
; `shove_far_from`.
[punch]
kill_hold=0.05
boss_hold=0.09
hit_hold=0.03
heavy_hit=40.0
hold_gap=0.22
close_reach=3.0
heavy_from=60.0
close_hold=0.07
point_blank=1.0
sawed_hold=0.09
kill_kick=0.7
flinch_floor=0.18
gib_more=6.0
gib_grow=0.18
gib_most=2.0
shove_near=1.35
shove_far=0.7
shove_far_from=9.0
; The stagger (src/stagger.gd): a hit's shove made an impulse on an inverted
; pendulum that catches itself with steps. `stagger` false: the old jumps.
; com_at: the middle's height (share of the body's); ankle: cells the centre
; of pressure moves on the foot; swing / first_swing: seconds a catch step
; takes; reach: a step's reach from the middle (share of the body's height;
; the first, hurried step first_share of it),
; `buckled` of it on a leg hit for `buckle_time`; steps_most: steps before he
; goes down; fall_past: a capture point past this many reaches goes down at
; once; push: the capture point a shove of d cells gives (d x push); push_most:
; the fastest; run_keep: of his run a man hit on the move keeps; damp: the
; hips' sway damped; knee_for / pitch_for / rise: seconds on a knee, pitched
; over and getting up; settle: speed under which it is over; longest: seconds
; at most. steady: kinds that never stagger.
stagger=true
com_at=0.55
ankle=0.07
swing=0.26
first_swing=0.2
reach=0.33
first_share=0.7
buckled=0.55
buckle_time=1.2
steps_most=3
fall_past=1.3
push=0.6
push_most=3.2
run_keep=0.9
damp=0.4
knee_for=0.55
pitch_for=0.8
rise=0.45
settle=0.08
longest=3.0
steady=["drone", "probe", "lantern", "saucer", "skeeter"]
; heft: a man's girth squared against heft_radius's (within heft_range) divides
; the push (big Billy, the tin guard reel less).
heft_radius=0.26
heft_range=[0.75, 2.2]

; The active bodies' play (src/body_play.gd, pass 15 T11): `play` false turns
; it all off. A reel the catch steps cannot stop holds on to an edge (a rail,
; a fence, furniture) within grab_reach of his height, its top between
; grab_low and grab_high of him, for grab_hold seconds instead of going down.
; Driven into a rail between over_low cells and over_high of his height
; faster than over_speed (cells a second) he goes over it to the far side
; (no more than over_drop cells down) and is down over_down times as long as
; pitched over; a boot's slide slammed into a wall puts him down slam_down
; times as long. A vehicle that leaves him up knocks him flat (ram_down times
; as long as pitched over), sliding on at ram_share of its speed. A drunk
; lurches across his way lurch cells every lurch_gait of his gait (6 a cell
; walked), each lurch_big-th lurch_big_k times as far.
[bodies]
play=true
grab_reach=0.5
grab_low=0.4
grab_high=0.75
grab_hold=0.7
over_high=0.68
over_low=0.25
over_speed=1.1
over_down=1.6
over_drop=3.2
slam_down=1.0
ram_share=0.6
ram_down=1.4
lurch_gait=15.0
lurch=0.3
lurch_big=4
lurch_big_k=3.4

; What each ammo pickup gives: [the gun it fills (weapons.cfg), rounds].
[ammo]
bullets=["revolver", 11]
shells=["shotgun", 10]
dynamite=["crossbow", 6]
rifle_ammo=["rifle", 24]
saw_ammo=["ripsaw", 5]
arm_ammo=["armgun", 9]
rocket_ammo=["bottle_launcher", 4]
rivet_ammo=["bowling_ball", 2]
pressure_ammo=["cow_launcher", 2]
milk_ammo=["teat_gun", 40]
bowling_ammo=["bowling_ball", 2]
keg_ammo=["powder_keg", 1]
cow_ammo=["cow_launcher", 1]

; Dirty fighting (features/brawl.gd, content pass 8). USE with one of the
; county's hands in front of you puts a boot in him: he slides back `speed`
; cells a second, slowing by `drag`, dazed for `daze` (open to a finisher);
; into a wall faster than `slam_least` he takes `slam` a unit of speed, into
; another man that one goes too (`domino` of it), off a drop of more than
; `drop` he takes `drop_damage` a cell. A boss slides `boss_share` as far and
; takes `boss_damage`. Running at a plain shut door (faster than
; `door_speed`), USE kicks it in and whoever stands within `door_reach`
; behind it is thrown back. Seconds: `land` until the boot lands, `rest`
; until the next, `busy` the gun is down.
[kick]
reach=1.6
cone=0.62
land=0.1
rest=0.5
busy=0.32
damage=14.0
speed=7.5
drag=11.0
stop=0.7
daze=1.6
stun=0.75
boss_share=0.3
boss_damage=12.0
slam=7.0
slam_least=2.6
domino=0.6
drop=0.9
drop_damage=45.0
door_speed=1.6
door_reach=2.4

