; How hits land (src/hit_zones.gd, enemies.gd, game_state.gd read it). Keys
; are what hurt() is told did it (`how`): a gun's weapons.cfg name for a
; bullet or a swing, a shot's kind for what flies ("blade", "bowling",
; "energy").

; Damage on the head by gun; the rest take default. A pellet less than a
; single round, so a load of buckshot stays a load.
[head]
default=1.5
revolver=2.0
rifle=2.0
hunter=2.5
mower=1.8
county45=2.0
star357=2.2
hogleg=2.2
riot_pump=1.35
tommy=1.8
grease_gun=1.8
patrol_bar=1.9
marksman=2.4
riveter=1.6
shotgun=1.35
crowbar=1.5
slingblade=1.5
blade=1.5
pressure_gun=1.25
bowling=1.25
ripsaw=1.2
teat_gun=1.0

; The arms and legs: damage there, and a leg hit's limp (seconds, pace).
[zones]
arms=0.82
legs=0.78
limp_time=3.0
limp_pace=0.55

; How each gun moves what it hits: [shove in cells, stun seconds, flinch
; seconds]. Champions take a quarter. The sawed-off's shove is per pellet.
[reaction]
shotgun=[0.075, 0.0, 0.0]
revolver=[0.12, 0.16, 0.0]
rifle=[0.04, 0.1, 0.0]
riveter=[0.08, 0.38, 0.3]
pressure_gun=[0.32, 0.0, 0.35]
crowbar=[0.28, 0.3, 0.0]
slingblade=[0.42, 0.4, 0.0]
bowling=[0.9, 0.9, 0.4]
blade=[0.15, 0.2, 0.0]
ripsaw=[0.06, 0.12, 0.0]
energy=[0.05, 0.3, 0.25]
; A thing thrown (features/carry.gd), whatever it weighs.
thrown=[0.3, 0.45, 0.3]
; A thing broken over his head, a boot (features/brawl.gd slides him itself).
smashed=[0.15, 0.5, 0.35]

; The 5v5 store's guns, likewise.
[reaction.store]
hunter=[0.36, 0.3, 0.2]
mower=[0.05, 0.1, 0.0]
county45=[0.1, 0.14, 0.0]
star357=[0.2, 0.22, 0.0]
hogleg=[0.22, 0.24, 0.0]
riot_pump=[0.075, 0.0, 0.0]
tommy=[0.05, 0.1, 0.0]
grease_gun=[0.05, 0.1, 0.0]
patrol_bar=[0.06, 0.12, 0.0]
marksman=[0.28, 0.26, 0.15]

; Slow motion on a finishing shot (features/finishers.gd; SLOW-MO FINISHERS,
; alone only: never in co-op, versus, online or County Run co-op): the kill
; that leaves nobody fighting within `reach` cells (none still awake and
; after you, none near) slows the world to `pace` for `length` real seconds,
; eased in and out (game_state.gd slow_pace), at most once in `rest` seconds
; of play. A boss's fall keeps its own (bosses.cfg [boss_fight] slowmo).
[finisher]
length=0.6
pace=0.3
reach=14.0
rest=6.0

; What each ammo pickup gives: [the gun it fills (weapons.cfg), rounds].
[ammo]
bullets=["revolver", 11]
shells=["shotgun", 10]
dynamite=["crossbow", 6]
rifle_ammo=["rifle", 24]
saw_ammo=["ripsaw", 5]
arm_ammo=["armgun", 9]
rocket_ammo=["bottle_launcher", 4]
rivet_ammo=["bowling_ball", 2]
pressure_ammo=["cow_launcher", 2]
milk_ammo=["teat_gun", 40]
bowling_ammo=["bowling_ball", 2]
keg_ammo=["powder_keg", 1]
cow_ammo=["cow_launcher", 1]

; Dirty fighting (features/brawl.gd, content pass 8). USE with one of the
; county's hands in front of you puts a boot in him: he slides back `speed`
; cells a second, slowing by `drag`, dazed for `daze` (open to a finisher);
; into a wall faster than `slam_least` he takes `slam` a unit of speed, into
; another man that one goes too (`domino` of it), off a drop of more than
; `drop` he takes `drop_damage` a cell. A boss slides `boss_share` as far and
; takes `boss_damage`. Running at a plain shut door (faster than
; `door_speed`), USE kicks it in and whoever stands within `door_reach`
; behind it is thrown back. Seconds: `land` until the boot lands, `rest`
; until the next, `busy` the gun is down.
[kick]
reach=1.6
cone=0.62
land=0.1
rest=0.5
busy=0.32
damage=14.0
speed=7.5
drag=11.0
stop=0.7
daze=1.6
stun=0.75
boss_share=0.3
boss_damage=12.0
slam=7.0
slam_least=2.6
domino=0.6
drop=0.9
drop_damage=45.0
door_speed=1.6
door_reach=2.4

; Finishers: USE (or a swing of the crowbar, sling blade or ripsaw) on one of
; the county's hands within `reach`, in front, who is down to `low` of his
; health, reeling (stunned `stagger` or more) or dazed by a boot. The move
; is picked by the gun in hand (the lists; anything else is the boot's) and
; game.rng among its moves below; its blow lands `wind` seconds after the
; press, the hands are busy `hold`. Alone (SLOW-MO FINISHERS, as finishers.cfg
; above) the world slows to `pace` for `slowmo` real seconds. Bosses are
; never finished.
[finish]
reach=1.75
cone=0.75
low=0.35
stagger=0.3
wind=0.15
hold=0.5
slowmo=0.9
pace=0.2
pistol=["revolver", "county45", "star357", "hogleg"]
long=["shotgun", "rifle", "hunter", "riot_pump", "tommy", "grease_gun", "patrol_bar", "marksman", "crossbow", "mower", "bottle_launcher", "cow_launcher", "pressure_gun", "riveter", "armgun", "teat_gun"]
blade=["crowbar", "slingblade", "ripsaw"]

; One finisher each: its `class`, what it says on screen (`name`), where it
; lands (`zone`), how it ends (`end`: "fall" he drops, "head_off" the blow
; takes his head off, "gib" he comes apart), what it counts as for how the
; body falls (`how`: corpses.gd, effects.cfg [ragdoll]), its sound, specks of
; blood thrown (`gore`), and `round` true when it spends a round from the gun
; in hand (with none loaded another move is picked).
[finish.whip]
class="pistol"
name="PISTOL WHIPPED"
end="fall"
zone="head"
how="crowbar"
