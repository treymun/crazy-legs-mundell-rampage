fair_iron_lit=Vector2(150, 0.95)
mill_tin_lit=Vector2(150, 0.95)
quarry_iron_lit=Vector2(150, 0.95)
quarry_shed_lit=Vector2(150, 0.95)
hub_service_wall_lit=Vector2(150, 0.95)
stanky_marquee=Vector2(170, 0.9)
