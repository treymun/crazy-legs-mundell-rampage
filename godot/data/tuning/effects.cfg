; Lights and glows the graphics-card view adds to the picture, read by
; src/effects.gd (and again within a second of saving, while the game runs
; from the project folder). The software view, kept as the fallback for
; graphics drivers the shader does not suit, draws without them, and so does
; the LIGHTS AND GLOW setting turned off. Godot ConfigFile text.
;
; [light.<source>]   one kind of light. Sources:
;     muzzle              the player's gun as it fires
;     blast_fire          an explosion (dynamite, drums, kegs, rockets, cows)
;     blast_energy        an alien arm bolt bursting
;     shot_<kind>         a shot in flight (plasma, arm_bolt, barker_bolt,
;                         lantern_bolt, bottle_rocket)
;     lamp                every lamp prop in the level
;     streetlamp          every lit street lamp board (hub_lamp)
;     key_brass, key_steel   a key lying where it can be picked up
;     trigger             what a level trigger's "light" action gives when it
;                         names no colour of its own
;   color     Color(r, g, b, 1), each 0 to 1 (ConfigFile wants all four)
;   radius    how far it reaches, in map cells
;   strength  how much it adds at its middle (1 doubles a surface's light)
;   life      seconds it fades over (blasts); missing: as long as its source
;   flicker   0 to 1, how much it wavers
;   height    how far above the floor it hangs (lamps, triggers)
;
; [level.<id>]   a level's mood:
;   fog         Color the distance fades to; fog_start and fog_full in cells,
;               fog_most how far it fades (0 to 1)
;   grade       Color(r, g, b, 1) every surface is tinted by (1 is none)
;   clouds      how fast the upper sky drifts (turns a second)
;   lightning   flashes a minute out over the fields (0: none), with thunder
;               rolling in a few seconds later (off with SCREEN FLASHES off)
;   crows, fireflies   crows cross the sky; fireflies blink in the dark yards
;
; [anim.<tile>]   a tile that moves: mode "neon" buzzes and now and then drops
;   out (rate: flickers a second, depth: how often it drops), "pulse" breathes
;
; [debris]   what fights leave about (features/debris.gd): seconds a case, an
;   ember, a scorch and a smoke puff last, and how many embers a blast throws
;
; [glow]   tile = Vector2(threshold, light): the tile's texels brighter than
;          the threshold (0 to 255, their brightest channel) light themselves
;          to at least `light` (1 is full daylight), whatever the room's light.

