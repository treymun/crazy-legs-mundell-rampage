dying_slack_end=1.0
dying_crawl=0.9
dying_brace_give=0.2
dying_hood=[0.36, 1.1, 0.75, 0.45]
; The beasts (pass 13, src/beast_doll.gd): [heft, belly, side, back, curl] =
; what the kill's hit, carry and spin are divided by (its lift by the root),
; how likely it comes to lie belly down, on its side away from the shot or
; on its back (a blast or buckshot at arm's length makes back twice and side
; 1.4 times as likely), and how far its legs lie out lying (a share of their
; reach: a dead crawler curls its legs in).
