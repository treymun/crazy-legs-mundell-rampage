; Lights and glows the graphics-card view adds to the picture, read by
; src/effects.gd (and again within a second of saving, while the game runs
; from the project folder). The software view, kept as the fallback for
; graphics drivers the shader does not suit, draws without them, and so does
; the LIGHTS AND GLOW setting turned off. Godot ConfigFile text.
;
; [light.<source>]   one kind of light. Sources:
;     muzzle              the player's gun as it fires; muzzle_<gun> (a
;                         weapons.cfg section) for that gun instead
;     blast_fire          an explosion (dynamite, drums, kegs, rockets, cows)
;     blast_flash         the instant one goes (features/gun_fx.gd, .14 s)
;     boom_glow           its fireball burning out (gun_fx.gd)
;     blast_energy        an alien arm bolt bursting
;     shot_<kind>         a shot in flight (plasma, arm_bolt, barker_bolt,
;                         lantern_bolt, bottle_rocket; tnt and keg: the fuse)
;     lamp                every lamp prop in the level
;     streetlamp          every lit street lamp board (hub_lamp)
;     key_brass, key_steel   a key lying where it can be picked up
;     pa_patch            the fair's PA patch lead lying where it can be picked up
;     station_todo        a station still to do, at its quest prop's lit lamp
;     station_done        a station done: its small green pilot
;     exit_locked, exit_open   a chapter's exit before and once the way is clear
;     gate_locked, gate_open   a Crossroads gate while locked and once open
;     trigger             what a level trigger's "light" action gives when it
;                         names no colour of its own
;   color     Color(r, g, b, 1), each 0 to 1 (ConfigFile wants all four)
;   radius    how far it reaches, in map cells
;   strength  how much it adds at its middle (1 doubles a surface's light)
;   life      seconds it fades over (blasts); missing: as long as its source
;   flicker   0 to 1, how much it wavers
;   height    how far above the floor it hangs (lamps, triggers)
;   pool      true: it lays a banded pool of its colour on the ground under it
;   hot       how wide (cells) the air over it shimmers (true is .4); a light
;             of strength 0 that is hot only shimmers
;   props     ["town_still", ...]: every prop with that picture carries this
;             light, `at` of the way up its height (0 to 1); its air
;             shimmers from `heat_at` of the way up (missing: from `at`)
;
; Sources of the props' own lights (props=): lantern, still, burn_barrel,
; grill, generator, ship_engine; airboat_engine is the swamp king's boat.
;
; [level.<id>]   a level's mood:
;   fog         Color the distance fades to; fog_start and fog_full in cells,
;               fog_most how far it fades (0 to 1)
;   grade       Color(r, g, b, 1) every surface is tinted by (1 is none)
;   clouds      how fast the upper sky drifts (turns a second)
;   lightning   flashes a minute out over the fields (0: none), with thunder
;               rolling in a few seconds later (off with SCREEN FLASHES off)
;   rain        how hard it rains at most (0 to 1; missing: never). Streaks
;               over the view, rings on water, puddles on [puddles] floors and
;               a wet sheen on walls under the open sky
;   showers     0 (or missing): it rains all chapter long, the ground soaked
;               from the start; above 0, the share of the time it rains, in
;               spells of about a minute that come and go
;   fog_banks   0 to 1: fog banks roll low over the ground and the treeline
;   heat        [Vector4(x, y, z, width)]: spots whose air shimmers
;               (beside the hot lights')
;   crows, fireflies   crows cross the sky; fireflies blink in the dark yards
;
; [water]    tile = 0 to 1: a water floor; how strongly it ripples, mirrors
;            the sky in broken bands and rings where a body wades
; [relief]   tile = -1 to 1: how deep the tile reads, raised where a texel is
;            brighter than its neighbours, so lights rake across it; below 0
;            the darker texels are the raised ones (brick with light mortar).
;            Signs and glowing texels stay flat; unlisted tiles too
; [puddles]  tile = 0 to 1: how readily the floor gathers puddles in the rain
;
; [anim.<tile>]   a tile that moves: mode "neon" buzzes and now and then drops
;   out (rate: flickers a second, depth: how often it drops), "pulse" breathes
;
; [debris]   what fights leave about (features/debris.gd): seconds a case, an
;   ember, a scorch and a smoke puff last, and how many embers a blast throws.
;   What stays (features/impacts.gd): at most <x>_cap of each, for <x>_life
;   seconds, then the oldest fade out first: hole (bullet holes), pock (in
;   the floor), wall_scorch, scorch (on the ground), splat_keep (blood on the
;   walls, which runs down). dust_cap: most dust, smoke and embers in the air
;   at once (features/dust.gd). wind_<level>: Vector2 cells a second the
;   smoke and dust drift on.
;
; [glow]   tile = Vector2(threshold, light): the tile's texels brighter than
;          the threshold (0 to 255, their brightest channel) light themselves
;          to at least `light` (1 is full daylight), whatever the room's light.

