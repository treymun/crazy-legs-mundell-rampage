[ragdoll]
; How a kill strikes a dead body (src/ragdoll.gd knock(), looks only; play's
; body, features/corpses.gd, says where the body goes and the ragdoll follows
; it). By what killed it (hurt()'s `how`; "shotgun_near" for buckshot at arm's
; length): [hit, carry, lift, buckle, spin] = the impulse where the hit
; landed (the speed it gives a ball weighing 1 there: a light head or arm
; moves more, the torso less), the speed given the whole body along the shot
; and up, the knees' give (forwards and down: it drops) and its turn about
; itself (radians a second, either way by the death's dice).
default=[2.4, 0.5, 0.0, 0.6, 0.5]
shotgun=[4.5, 1.0, 0.3, 0.3, 0.8]
shotgun_near=[7.0, 2.0, 1.1, 0.0, 1.2]
hunter=[5.0, 1.3, 0.4, 0.2, 0.9]
marksman=[4.5, 0.8, 0.2, 0.4, 0.6]
rifle=[3.6, 0.1, 0.0, 1.2, 0.4]
revolver=[3.0, 0.6, 0.0, 0.5, 0.6]
star357=[3.6, 0.7, 0.1, 0.5, 0.7]
hogleg=[3.8, 0.8, 0.1, 0.5, 0.7]
riot_pump=[4.5, 1.0, 0.3, 0.3, 0.8]
crowbar=[2.0, 0.0, 0.0, 1.4, 0.8]
slingblade=[2.2, 0.1, 0.0, 1.3, 1.0]
teat_gun=[2.0, 1.0, 0.0, 0.2, 0.4]
bowling=[5.0, 1.6, 0.6, 0.0, 1.0]
blast=[4.0, 2.2, 2.0, 0.0, 1.4]
energy=[4.5, 1.6, 1.0, 0.3, 1.2]
kick=[4.0, 2.0, 0.6, 0.0, 0.8]
kick_finish=[6.0, 3.0, 1.4, 0.0, 1.2]
; Where it struck (Enemy.last_zone; a blast is "body"): [hit's share, buckle
; added, spin added, fade] - a head shot snaps the head back and the muscles
; go at once (it drops), a leg shot takes that leg out from under it, an arm
; turns it; fade is the seconds the muscles take to go slack (its dice deal
; .7 to 1.4 of it).
zone_head=[1.3, 1.6, 0.2, 0.06]
zone_body=[1.0, 0.0, 0.0, 0.2]
zone_arms=[1.0, 0.3, 1.4, 0.22]
zone_legs=[1.2, 1.0, 0.5, 0.25]
; Each ball's push varies by up to this share (its own dice).
spread=0.3
; Living bodies taking a hit (pass 15, src/live_body.gd, looks only): at most
; live_most at once (the nearest; live_phone on a phone or the LOW physics
; tier). live_tone: the muscles' pull (a share of the error a pass), live_soft:
; what is left of it the instant a hit lands, back over live_recover seconds;
; live_upright: the ankle's turn toward upright (a share a pass), at most
; live_upright_most radians a pass; live_carry: play's middle's pull on the
; torso; live_support: the stance legs' push holding the hips' height;
; live_strike: the hit's impulse (speed given where it lands, a unit of play's
; push); live_swing: a catch step's seconds; live_lift: a step's lift (share
; of the body's size); live_margin: how far the capture point may be off the
; feet before a step (map units a unit of size); live_clutch: seconds a hand
; holds the wound [least, most]; live_buckle: a buckled knee's pose shortened
; (share of size); live_longest: seconds at most.
live_most=4
live_phone=2
live_tone=0.45
live_soft=0.1
live_recover=0.7
live_upright=0.2
live_upright_most=0.02
live_carry=0.08
live_support=0.1
live_strike=5.0
live_swing=0.22
live_lift=0.09
live_margin=0.14
live_clutch=[1.1, 2.2]
live_buckle=0.3
live_buckle_give=0.5
live_soft_full=0.5
live_head=3.0
live_clutch_pull=0.3
live_arm=1.4
live_settle=1.8
live_rise=0.006
live_muscle_most=0.012
live_speed_most=5.0
live_down_legs=0.1
live_down_upright=0.5
live_down_knee=2.2
live_longest=4.0
; The active bodies (pass 15 T11, src/active_body.gd, looks only). Bracing:
; the torso tipping past active_tip radians from upright (or play's down,
; pitched), the arms active_brace times as stiff, a hand on the floor held
; active_brace_hold seconds, the head held active_head_guard radians off the
; fall, the ankle's turn active_brace_upright of its own. Getting up: the arms
; active_rise_tone times as stiff. Windmilling from active_mill_from map units
; a second, active_mill_rate turns a second, active_mill_tone stiff. A grab
; held [least, most] active_grab_hold seconds, let go at active_grab_force of
; the arm's length. Shoved (stunned) from active_shoved_from map units a
; second. A drunk near the eye (active_drunk_reach cells): his balance looked
; at every active_drunk_late seconds, a step active_drunk_over times as far
; as the capture point and active_drunk_noise off (share of size), a sway of
; active_drunk_sway, the ankle active_drunk_upright of its own.
active_tip=0.75
active_brace=2.0
active_brace_hold=0.3
active_head_guard=0.6
active_brace_upright=0.3
active_rise_tone=1.8
active_mill_from=1.2
active_mill_rate=2.2
active_mill_tone=1.5
active_grab_hold=[0.5, 1.0]
active_grab_force=1.3
active_shoved_from=1.5
active_drunk_reach=9.0
active_drunk_late=0.2
active_drunk_over=1.5
active_drunk_noise=0.1
active_drunk_sway=0.8
active_drunk_upright=0.4
; The dying (src/dying_doll.gd, looks only): the muscles' pull dying_tone (a
; share a pass), the legs dying_legs of it, no ball moved more than
; dying_muscle_most a pass; slack over [least, most] dying_slack seconds (a
; head shot dying_head); on the ground [limp, writhe, get up, crawl] by
; dying_styles, for [least, most] dying_writhe seconds, then slack over
; dying_slack_end; a crawl's reach and pull every dying_crawl seconds; the
; arms give dying_brace_give seconds after a hand is down; run down, the
; vehicle's front [height, length, width (shares of him), seconds] dying_hood.
dying_tone=0.3
dying_legs=0.12
dying_muscle_most=0.02
dying_slack=[1.0, 2.0]
