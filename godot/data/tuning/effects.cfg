; ---------------------------------------------------------------- pass 15 LOOKS
; Looks only (the 3D view and the picture): none of it is play, its dice are
; its own, nothing is saved or carried.

[rim]
; The warm edge on a hand that is awake (view3d/actor_rim.gdshader, a pass of
; its own hung on the model by actor_rim.gd): a line round his outline, in
; thirds, so a hand reads against any wall and a far one is more than a
; smudge. Needs LIGHTS AND GLOW (QUALITY LOW drops it); a hit's wash and a
; wind-up's amber come first.
;   awake      Color(r, g, b, 1): the rim of a hostile hand awake
;   near       how much of it up close (0 to 1)
;   far        how much at far_at cells and beyond (it rises between)
;   near_at, far_at   cells
;   soft, bold  ENEMY RIM's two looks: [how far out past the body the edge
;              stands (.6 is one pixel at 320 wide), its brightness up close
;              and far off (shares of the colour: below 1 it sits dark into
;              the scene), the share of that taken off by 20 cells (a small
;              far figure keeps its own pixels), the share of the fog it
;              shows through]
;   fade       seconds it takes to come up as he wakes
;   critter, critter_strength   a cool rim on the animals (critters below)
;   critters   the kinds that get it
awake=Color(1, 0.56, 0.2, 1)
near=0.45
far=1.0
near_at=3.0
far_at=15.0
soft=[0.6, 0.3, 0.6, 0.3, 0.35]
bold=[1.0, 0.45, 1.0, 0.45, 0.6]
fade=0.3
critter=Color(0.62, 0.78, 1, 1)
critter_strength=0.36
critters=["chicken", "pig", "cow", "mule"]

[pickup_glint]
; Ammo, food and scrap lying out catch the light now and then: a two-frame
; star (fx_twinkle_0, _1: small, big, small) at the top of the pickup, every
; `every` seconds (each its own beat by where it lies), `step` seconds a
; frame, `size` cells tall, out to `reach` cells. They bob `bob` cells (EASY
; ON THE EYES: [full, reduced, still]) and glint `calm` times as seldom.
every=2.6
step=0.07
size=0.22
reach=16.0
bob=[0.05, 0.018, 0.0]
calm=[1.0, 1.6, 2.4]

[hurt_looks]
; Hurt (features/hurt_looks.gd, display.gdshader `pain` and `drain`): a blow
; draws a red-brown vignette in from the edges (dithered, the palette's
; blood), `pain_floor` at least and all of it for `pain_full` damage, fading
; over `pain_fade` seconds; under `low_from` health the world drains toward
; sepia, `drain_most` of the way at `drain_full` health and under, and the
; vignette holds at up to `low_edge`; under `heart_from` the heart thumps
; (heart_thump, `heart_slow` beats a minute there, `heart_fast` at 1 health),
; each beat swelling the vignette by `thump`. SCREEN FLASHES scales the
; vignette (REDUCED a third, OFF none) and the drain (REDUCED about half).
pain_full=30.0
pain_floor=0.3
pain_fade=1.1
low_from=30
drain_full=8
drain_most=0.72
low_edge=0.42
heart_from=20
heart_slow=72.0
heart_fast=120.0
thump=0.22
thump_volume=0.7

