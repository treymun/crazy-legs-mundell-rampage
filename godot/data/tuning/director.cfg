; The fight-rhythm director (pass 15, src/features/director.gd, src/director_beats.gd;
; read by src/core/director_data.gd). A chapter goes BUILD (the level's own hands
; as placed) -> PEAK (a group held back comes at the player from out of sight,
; when they do a station, take a key, walk into a new district or have walked
; a while) -> BREATHER (no hands sent, those out past `guard_near` stop coming
; to look at shots, a pickup of what they are short of at the peak's last
; kill) and round again. Only in the eight chapters, campaign and co-op; never
; a hand a trigger, a set piece, a partner pair, a patrol, a boss (or near
; one), the tough guy or the start names or stands at.

[all]

; false: the director never runs (tools set DirectorData.ON as well).
on=true
; Chapters it leaves alone (ids), should one want its own pace.
off_chapters=[]
; Seconds between its looks at the fight.
scan=0.25
; A hand within this many cells of a player, alerted, is "on" them; this many
; on them is a full crowd (intensity 1 in a fight).
near=14.0
crowd_full=5
; No hand is held within this many cells of the start, of a boss or of the
; chapter's last boss.
start_clear=12.0
boss_clear=18.0
; No peak within this many cells of a boss still up (awake or waiting), and a
; breather when a boss's fight begins (its hands go back to the held ones)
; and when it ends. (Pass 15 balance: 45 -> 32. At 45 most of Hickston and
; the Mothership were "near a boss": one peak a chapter there, 0.8 in the
; Mothership, with 40-odd hands held and never sent.)
boss_quiet=32.0
; A peak takes at least this many of the held hands (a station or a key: one
; is enough), the ones nearest the party first. They come in from spots this
; many cells out from the player (out of every player's sight, on their floor,
; at most `peak_steps` steps away by the way). A woken hand hunts this long
; before it searches.
peak_least=2
peak_spot=[8.0, 15.0]
peak_steps=24
peak_hunt=14.0
; A peak is over when its hands are down, when none of them has been on the
; party for `peak_cold` seconds, or after `peak_most` (its stragglers fight on).
peak_cold=8.0
peak_most=50.0
; No peak before this many seconds into a chapter, nor within `build_least`
; of the last breather's end (half that for a station or a key). (Pass 15
; balance: 10 -> 16, so a walk-in peak does not land on the tail of the
; fight after the last one: two peaks in one unbroken fight made the
; 74 to 129 s fights of the long report.)
first_peak=20.0
build_least=16.0
; Seconds after walking into a district not seen before that it counts as
; a reason for a peak (the player is in its middle by then).
district_settle=5.0
; Quiet that ends a fight (seconds with no hand on the player).
quiet_gap=5.0
; In a breather or a long fight a hand out past `guard_near` cells does not
; come to look at a shot it heard, and the level's own hands between that and
; `hush_reach`, out of sight and after nobody, keep still till it is over (each
; back where it stood once no player can see the spot). (Pass 15 balance:
; hush_reach 32 -> 40, the trickle of a long fight thinned a little more.)
guard_near=9.0
hush_reach=40.0
; A walk-in or the timer brings a peak only after this many seconds with no
; hand on the party (a station or a key does not wait).
peak_quiet=6.0
; In a long fight every this-many-th kill leaves what the player is short of.
relief_every=4
; Lines on the HUD as a peak comes (by turns).
peak_lines=["HERE COMES THE KIN!", "THEY BROUGHT COUSINS!", "THE WHOLE HOLLER'S COMIN'!", "MORE OF 'EM, BOY!", "DINNER BELL RUNG!"]

; By difficulty: EASY, NORMAL, HARD, HOG WILD.
; Pass 15 balance (T10, the long report at NORMAL, ROOKIE, REGULAR and SHARP
; seeds 1-3): crowds of 3+ alerted within 14 were 35-37 % of the fighting
; (target 40) with only 1 to 2.6 peaks a chapter; NORMAL now holds back
; .45 (was .35) with .25 extras (.2), a first peak of 6 (5) growing to 8
; (7), the timer's peak after 28 s (35) and the long-fight guard at 28 s
; (35): 2.4 to 3 peaks a chapter, 3+ 42-45 %, the longest fight with no
; boss in it 88-103 -> 52-92 s, deaths no higher.
[pace]

; The share of each district's hands held back for its peaks.
hold_share=[0.25, 0.45, 0.35, 0.35]
; Hands added to each district's held groups, as a share of its hands (beside
; a held one, its kind).
extra_share=[0.0, 0.25, 0.25, 0.3]
; How far off (cells) a held hand may be to come in a peak; the most in a
; chapter's first peak, one more each peak after, up to the most in one.
peak_reach=[36.0, 40.0, 44.0, 48.0]
peak_first=[3, 6, 6, 6]
peak_group_most=[4, 8, 8, 9]
; Seconds of walking and fighting before a peak comes anyway.
build_for=[45.0, 28.0, 30.0, 25.0]
; Seconds of breather after a peak.
breather_for=[20.0, 15.0, 12.0, 10.0]
; A fight this long with no gap holds the hands from far off (and any peak).
long_fight=[30.0, 28.0, 45.0, 60.0]
