; Vehicles the player can get in and out of with USE (src/features/vehicles.gd,
; src/vehicle_drive.gd, docs/dev/gameplay.md "Vehicles"). A level places them
; in its "vehicles" list ([kind, x, y, heading]); each kind's numbers are here.
;
; picture   the prop model shown (town_<name>), height its shown height and
;           nose the model's turn against the heading (radians: the models
;           were posed turned for their sprites, 20 and 18 degrees, the
;           tractor a quarter turn)
; length, width, tall   the hull (cells): an oblong for walls and bodies
; top, reverse   top speed forward and back (cells a second)
; accel, brake, coast   speeding up, braking, rolling to a stop (a second)
; turn       how fast it turns at full lock (radians a second), turn_full the
;            speed it needs for that (slower turns less)
; grip       how fast a slide dies (a second; low: it slides), skid the slide
;            that leaves marks and squeals; handbrake the grip with JUMP held
; step       the highest step it climbs (stairs and kerbs stop it)
; floors     the only floors it runs on (tile names; empty: any but deep water)
; slow_floors, slow   floors it runs on at `slow` of its top speed
; hp, soak   its health, and the share of the driver's hurts it takes
; seats      how many ride (the second rides along and shoots: the
;            airboat's behind the driver, the car's passenger beside)
; hands      1: the guns work from the seat; 0: both hands on the wheel
; eye, seat  the eye's height over its floor and the seat's place along it
; sit        a rider's body seen from outside (PHOTO MODE, a partner, the
;            mirror): its feet over the floor, below it to sit the hips on
;            the seat (looks only; with hands 0 the shell hides the driver)
; pose       the rider's model's frame in it: "sit" sits him down (the
;            mower; its `sit` then puts his boots on the deck), else as on foot
; ram        damage to a body run over for each cell a second of speed, from
;            ram_from up; blade a cut each BLADE_EVERY to what it runs over
; cuts       grass mown behind it (marks) and breakables cut down in front
; engine          the engine loop heard while the driver's seat is occupied
;            (its pitch rises with the speed)
; How it looks on the move (src/vehicle_feel.gd; looks only, never play):
; spring, damp   the body's springs: how often it bobs (a second) and how
;            soon that dies away (1: no bounce back)
; lean, lean_most   the roll out of a turn (radians for each cell a second
;            squared across it) and the most; squat, squat_most the pitch up
;            on the throttle and down braking (the same, along it)
; rough, rough_off   the jolts it takes running (on any floor, and more on
;            its slow floors and grass) for each cell a second
; rock       the rocking on water (radians)
; spray, sparks, brake_skid   spray off the bow and a wake behind on water,
;            sparks where it scrapes a wall, skid marks braking hard too
; slap, trim the airboat's hull slapping the water at speed (the springs'
;            kick, cells a second) and its bow lifting at top speed (radians)
; The seat view (src/vehicle_cab.gd, src/view3d/cab_layer.gd; looks only):
; cab        the driver's own vehicle seen from the seat (assets3d/cabs)
; cab_drop, cab_tilt   the eye sits this much lower in it (cells) and it
;            tips its nose up this far (radians), so more of it is in view
;            with the road still showing over its nose
; cab_lock   how far the wheel (the airboat's stick) turns at full lock
; buzz, buzz_hz   the engine's shake of the view (cells at full throttle)
;            and how fast it shakes; chug the mower's single cylinder
;            thumping (cells); seat_dip the eye's dip at top speed (cells)
; Finding it and riding it (feature pass 7; src/vehicle_finder.gd):
; spotted    the line said once when a player first comes near it
; lamps      its lamps, left on while it stands ready ([ahead, right, up]
;            from its middle, cells): a light each and a glow
; radio      a radio left playing in it (the jukebox's tune, quiet)
; window     its hands are on the wheel (hands 0) but a one-handed gun
;            ([all] window_guns) goes out of the window: the other hand
;            stays on the wheel, steering at one_hand_turn
; ride_side, ride_back   where the second seat is from the driver's: to the
;            right (the car's passenger) and behind (the airboat's)

[all]

; A hit enemy is not hit again by the same vehicle for this long (seconds).
hit_gap=0.5
; Wall bumps harder than this (cells a second into the wall) hurt it.
bump_from=2.6
bump_damage=7.0
; Out of the wreck: what the people in it take, and the blast it makes.
eject_damage=12.0
wreck_blast="fuel"
burn=9.0
; Enemies in the way step aside when it comes at them faster than this, from
; this far ahead; one in DODGE_SKIP stands its ground.
dodge_from=4.0
dodge_reach=6.0
dodge_skip=4
dodge_speed=3.4
; A blast this close hurts it, up to blast_damage at its middle.
blast_reach=3.2
blast_damage=120.0
; How far a hull may be from the player's hand to get in (cells); reach_wide
; when nothing else is at hand to USE (a station, a door).
reach=1.1
reach_wide=1.7
; The prompt names a ready vehicle from this far off, looked at (cells), and
; the line it has (`spotted`) is said once from this far, in sight.
spot_reach=7.0
spot_told=11.0
; Its radio is heard from this far, this loud (of the jukebox's level).
radio_reach=9.0
radio_volume=0.42
; Out of a window (the car's `window`): the guns that go one-handed, how far
; round from the nose a shot may go (degrees: not back through the cage),
; how much more it strays, and how much a seated rider's strays.
window_guns=["revolver", "shotgun", "county45", "star357", "hogleg", "tnt"]
window_arc=110.0
window_spread=1.6
rider_spread=1.25
one_hand_turn=0.75

