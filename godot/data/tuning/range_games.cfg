; The midway games' numbers (RangeTuning, src/core/range_tuning.gd): the
; firing range's games row (src/range_games.gd, src/range_skeeball.gd), the
; fair's shooting gallery (src/features/fair_gallery.gd) and the range's
; board on the lobby server (src/range_board.gd). Read when their scripts
; load: a change shows at the next start. Their shapes (a shoe, the stake,
; the skee-ball lane and rings, a bottle, the dunk tank) are in
; src/range_games_shape.gd, which the 3D view draws them from too. Cells are
; about a yard; speeds in cells a second.

[horseshoes]
; Shoes a game; how fast a shoe leaves the hand and how far above the look
; it goes up (the slope added to where the pitcher looks); how fast it turns
; in the air (radians a second); how much of its run it keeps landing in the
; pit, the clay's drag as it slides (cells a second, a second), what the
; stake gives back of a knock, and how close (from the bar to the stake) a
; shoe must lie for a point.
shoes=10
speed=10.4
loft=0.466
spin=7.0
keep=0.45
drag=14.0
knock=0.3
point=0.17
; A pitcher's hand is not a machine: each pitch's speed is off by up to
; this share and its way by up to this many radians (the game's dice).
wobble=0.03
aim_wobble=0.015

[skeeball]
; Balls a game; how fast a ball leaves the hand looking down the lane
; (slow) and up (fast); the lane's drag; what the rails and the back give
; back; seconds down a ring's drain.
balls=9
slow=3.6
fast=6.4
drag=0.35
rail=0.5
back=0.15
drop=0.45
; Each roll's speed off by up to this share, its way by radians (the dice).
wobble=0.025
aim_wobble=0.02

[dunk]
; A round's seconds; how far the bullseye swings (radians) and how fast;
; seconds the hand stays under and takes to climb back up.
round=30.0
swing=0.5
rate=1.7
under=2.2
climb=1.0

[bottles]
; Softballs a round; how fast one is thrown and how far above the look it
; goes; its weight against a bottle's 1; the solver's steps a tick; the
; longest a round waits on the bottles to lie still.
balls=3
speed=10.5
loft=0.1
ball_mass=0.8
steps=6
longest=6.0
; Each throw's speed off by up to this share, its way by radians (the dice).
wobble=0.03
aim_wobble=0.015

[fair_gallery]
; A round's seconds; points for each target (the bell starts a round and
; scores nothing); a can kicked again in the air scores again; the round's
; prizes (points for a beer, the hat, the bear); how fast the rails run
; (cells a second) at the start and how much faster by the end; seconds a
; target stays down; a tin can's bounce and the floor's drag on it.
round=30.0
duck=2
can=1
bottle=3
hog=5
air_can=2
beer=15
hat=30
bear=45
speed=1.2
speed_up=0.9
down=1.4
can_bounce=0.45
can_drag=2.5

[range_board]
; Rows kept a game on the server, rows sent back, and seconds to wait on the
; server's answer.
keep=30
shown=5
wait=4.0
