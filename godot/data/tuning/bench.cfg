; Mundell's junk bench: the scrap lying about and the duct-tape mods it buys,
; read by src/bench_mods.gd and src/features/bench.gd (once a game; the mods'
; numbers again within a second of saving, as weapons.cfg's are). Godot
; ConfigFile text: keep each value's form (6 is a whole number, 6.0 is not).
; Only in the campaign's chapters and the Crossroads, alone or in co-op, with
; WORKBENCH on (BenchMods.on): never the range, County Run, a player map, a
; boss rematch or the versus modes.

[scrap]

; What each piece of scrap is worth: its pickup is item_scrap_<piece>.
pieces={"bolts": 1, "wire": 2, "hubcap": 3}
; Most scrap a player carries.
most=99
; How far apart dropped pieces land round where they came from, and the
; reach a piece is taken from (a pickup's own .62 in game.gd).
spread=0.45

[drops]

; A hand killed by a player drops scrap one time in `enemy_chance`
; (the kinds in `enemy_kinds` at their own chance), its piece picked from
; `enemy_pieces` with game.rng. A boss drops `boss` (every piece in it).
enemy_chance=0.06
enemy_kinds={"millhand": 0.25, "yard_deputy": 0.2, "shield_deputy": 0.3, "chain_hand": 0.25, "boilerback": 0.3, "tin_guard": 0.3, "pit_mechanic": 0.35, "tire_roller": 0.3, "nitro_huffer": 0.2, "foreman": 0.4, "baron": 0.4, "tough_earl": 0.5, "tough_clem": 0.5, "tough_tom": 0.5, "tough_bubba": 0.5, "tough_chuck": 0.5, "tough_pete": 0.5, "tough_zorgo": 0.5, "valve_rat": 0.12, "drone": 0.15, "probe": 0.15}
enemy_pieces=["bolts", "bolts", "bolts", "wire", "wire", "hubcap"]
boss=["hubcap", "hubcap", "wire", "bolts"]
; A breakable broken (breakables.cfg's pictures): its chance and piece.
props={"prop_barrel": [0.2, "bolts"], "town_warning_barrel": [0.35, "bolts"], "town_gas_cans": [0.3, "bolts"], "town_cooler": [0.25, "wire"], "town_ice_chest": [0.25, "wire"], "town_mailbox_row": [0.6, "hubcap"], "town_propane_tank": [0.5, "wire"], "town_nitro_rack": [0.5, "wire"], "town_alien_crate": [0.4, "wire"], "town_still": [0.6, "wire"], "town_copper_vat": [0.7, "wire"], "town_shine_tank": [0.5, "hubcap"], "town_camp_chairs": [0.3, "bolts"], "prop_crate": [0.1, "bolts"], "town_pallet_stack": [0.15, "bolts"], "town_tnt_crate": [0.15, "bolts"]}
; A vehicle wrecked, a set piece come down (set_pieces.cfg kinds): every
; piece in its list.
vehicle=["hubcap", "hubcap", "wire", "bolts"]
set_pieces={"barn": ["wire", "bolts", "bolts"], "tower": ["hubcap", "wire"], "fuel": ["wire", "bolts"]}

[placed]

; Loose scrap laid out in each chapter as it starts: this many pieces, each
; beside one of the chapter's own pickups (every `stride`th of them, from the
; far end of the list), its piece in turn from `pieces`.
count=3
stride=5
pieces=["hubcap", "wire", "bolts"]

[bench]

; The Crossroads' bench stands in the Road Department's yard, its back to the
; depot's wall: its middle, its facing (radians: its front looks along
; (sin, cos)).
hub_at=Vector2(53.7, 47.48)
hub_facing=0.0
; Each chapter's bench near where the chapter starts: a spot `near` to `far`
; from the start with its back to a wall, `width` by `depth` of clear floor.
; A player walking into it is put back out (it has no box of its own).
; Never within `clear_of_view` radians of the way the chapter starts you looking.
near=2.0
clear_of_view=1.2
far=4.5
width=1.66
depth=0.66
; USE reaches it from this far, looking within `facing` radians of it; the
; bench screen shuts when its player goes further than `leave`.
reach=1.7
facing=0.9
leave=2.4
; The picture its 3D model stands for (town_<name>) and how tall it stands.
model="town_junk_bench"
height=2.05

; The mods, one section each, in the order the bench lists them (and buys
; them by: Controls.buy is the place in this order, so a new mod goes last).
;   gun     the gun it goes on (weapons.cfg)    short  its picture's name
;   label   its name on the tag                  price  scrap it costs
;   line    what the tag says it does (hand lettered under the name)
;   set     weapons.cfg keys it changes to these values
;   times   weapons.cfg keys it multiplies (a whole number stays whole)
; and the mods' own keys, in `set`:
;   bayonet       [damage, reach, finishes below this share of health]: FIRE
;                 with the gun dry or loading jabs the hand in front
;   burns         the shot's blast lights what it reaches, this share of its
;                 radius (features/fire.gd)
;   blast_scale   Vector2(radius, strength) the shot's blast is scaled by
;   fuse          the dynamite's fuse, seconds

[mod.scope]

gun="revolver"
short="scope"
label="PAWN SHOP SCOPE"
line="ALT FIRE: LOOK CLOSE"
price=6
set={"scope": 2.1, "scope_spread": Vector2(0.0, 0.0), "range": 36.0}

[mod.loader]

gun="revolver"
short="loader"
label="SPEED LOADER"
line="RELOADS IN A BLINK"
price=4
times={"reload_time": 0.5}

[mod.bayonet]

gun="shotgun"
short="bayonet"
label="CORN KNIFE"
line="DRY? STICK 'EM"
price=5
set={"bayonet": [38, 1.55, 0.4]}

[mod.choke]

gun="shotgun"
short="choke"
label="PIPE CHOKE"
line="TIGHT PATTERN"
price=6
times={"spread": 0.6, "range": 1.4}

[mod.drum]

gun="rifle"
short="drum"
label="DRUM MAG"
line="320 ROUNDS, RUNS COOL"
price=7
set={"max_reserve": 320}
times={"heat_gain": 0.6}

[mod.brake]

gun="rifle"
short="brake"
label="COFFEE CAN BRAKE"
line="NO CLIMB. LOUD AS SIN"
price=6
times={"climb": 0.35, "climb_heat": 0.4, "heat_spread": 0.5, "shot_noise": 1.3}

[mod.flame]

gun="crossbow"
short="flame"
label="FLAMING BOLTS"
line="SETS 'EM ALIGHT"
price=7
set={"burns": 0.6}

[mod.spring]

gun="crossbow"
short="spring"
label="TRUCK SPRING"
line="FASTER, FLATTER"
price=5
times={"shot_speed": 1.45, "shot_lift": 0.5, "fire_time": 0.75}

[mod.fuse]

gun="tnt"
short="fuse"
label="LONG FUSE"
line="COOK IT LONG"
price=3
set={"fuse": 4.4}

[mod.bundle]

gun="tnt"
short="bundle"
label="3-STICK BUNDLE"
line="BIGGER BANG"
price=8
set={"blast_scale": Vector2(1.4, 1.5)}
