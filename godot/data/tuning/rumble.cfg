; The phone (Android, and a phone's browser that can buzz: an iPhone's
; cannot). One buzz at a time, for the strongest pulse that just began:
; none under `floor` (after the level), none sooner than `gap` seconds after
; the last; `least_ms` to `most_ms` long, times `scale`. A browser cannot
; set how hard: there a weaker pulse buzzes shorter, down to `web_short` of
; its length.
[phone]

floor=0.12
gap=0.06
least_ms=15
most_ms=300
scale=1.0
web_short=0.35
