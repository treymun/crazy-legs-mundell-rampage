; Controller rumble and phone buzz (looks only: never play). Read by
; src/core/rumble_data.gd for features/rumble.gd (what the local player
; feels) and src/rumble_out.gd (the pad's motors and the phone); see
; docs/dev/gameplay.md "Rumble and haptics". Godot ConfigFile text: keep each
; value's form (0.5, not .5 or 1/2).
;
; A pulse is [weak, strong, seconds]: weak drives a pad's small fast motor
; (in its right grip), strong its big slow one (in the left grip), each 0 to
; 1 at FULL; it lasts `seconds`, at full for the first `hold` part of that,
; then fading out. A phone has one motor: it buzzes the bigger of the two.

[all]

; RUMBLE / PHONE RUMBLE LOW: every pulse times this (FULL: times 1)
low=0.45
; the most each motor is driven when pulses overlap (they add up to this)
cap_weak=1.0
cap_strong=1.0
; the part of a pulse held at full before it fades out
hold=0.35
; the most pulses at once (the oldest goes first)
pulses_most=24
; a pad is told again when a motor moves more than this, or every `refresh`
; seconds while it runs; each telling runs `refresh` plus `linger` seconds,
; so a pad left running by a stalled frame stops by itself
send_step=0.04
refresh=0.2
linger=0.1
; under this on both motors the pad is stopped
quiet=0.02
; a pad still counts as the one played with this long (seconds) after its
; sticks or triggers last moved (the keys and mouse in hand: it stays still)
pad_idle=20.0
; what changing the setting gives at once, to feel the level picked
taste=[0.5, 0.7, 0.25]
; a gun firing both barrels or a pair of rivets: its pulse times this
pair=1.35

; Each gun's shot (weapons.cfg's section names). A new gun gets a line here
; (none: it fires without a pulse). Crack: weak-heavy and short; thump:
; strong-heavy and long; a rattle: shorter than the gun's fire_time, so the
; shots come apart.
[guns]

crowbar=[0.12, 0.04, 0.06]
revolver=[0.6, 0.28, 0.08]
shotgun=[0.45, 0.95, 0.22]
crossbow=[0.22, 0.32, 0.1]
rifle=[0.42, 0.3, 0.06]
ripsaw=[0.3, 0.4, 0.12]
armgun=[0.5, 0.15, 0.12]
tnt=[0.12, 0.3, 0.1]
slingblade=[0.12, 0.05, 0.07]
bottle_launcher=[0.3, 0.55, 0.15]
riveter=[0.5, 0.2, 0.07]
pressure_gun=[0.4, 0.12, 0.1]
bowling_ball=[0.08, 0.42, 0.15]
powder_keg=[0.1, 0.55, 0.18]
cow_launcher=[0.4, 1.0, 0.32]
teat_gun=[0.16, 0.04, 0.04]
hunter=[0.65, 0.85, 0.18]
mower=[0.5, 0.3, 0.045]
county45=[0.5, 0.32, 0.08]
star357=[0.62, 0.45, 0.1]
hogleg=[0.66, 0.62, 0.12]
riot_pump=[0.45, 0.9, 0.2]
tommy=[0.45, 0.22, 0.04]
grease_gun=[0.32, 0.42, 0.055]
patrol_bar=[0.5, 0.45, 0.055]
marksman=[0.6, 0.7, 0.15]
flash_jar=[0.1, 0.16, 0.07]
smudge_pot=[0.06, 0.28, 0.09]
shine_cocktail=[0.1, 0.2, 0.08]
firecracker_can=[0.14, 0.18, 0.08]

; A melee gun's swing landing on someone (the swing itself is its [guns]
; line); on a wall or a thing, times `wall`. The rip saw held on both triggers
; grinds: `grind` each of its bites (one every 0.135 s, so they run into one
; buzz), `bite` when the teeth are in someone.
[melee]

crowbar=[0.3, 0.6, 0.12]
slingblade=[0.45, 0.45, 0.12]
wall=0.6
grind=[0.75, 0.22, 0.16]
bite=[0.35, 0.55, 0.1]

; The dynamite: the match struck, and the stick thrown (the other throwables
; are guns: their [guns] line).
[dynamite]

light=[0.25, 0.0, 0.05]
throw=[0.12, 0.3, 0.1]

; Hurt: [weak, strong, seconds] for a blow of `full` health or more; a
; smaller one by its share, never less than `least` of it. A blow from one
; side leans to that side's motor by `lean` (from the right: weak up, strong
; down); one from nowhere in particular (a fall, steam) stays even.
[hurt]

pulse=[0.55, 0.85, 0.24]
full=30.0
least=0.25
lean=0.5

; USE's boot as it lands: on a man, into the air, through a door; a
; finisher's blow (the stomp its own).
[boot]

hit=[0.4, 0.85, 0.16]
miss=[0.1, 0.12, 0.06]
door=[0.35, 1.0, 0.22]
finish=[0.55, 0.9, 0.2]
stomp=[0.3, 1.0, 0.25]

; A blast: `pulse` right on top of it, gone at `reach` cells (times the
; blast's size). Its strength falls off as (1 - distance / reach) to the
; power `falloff`, its length to `short` of it at the edge. Size is the
; blast's shots.cfg radius over `radius`, kept between `size_least` and
; `size_most`; the greys' plasma bursts are times `energy`.
[blast]

pulse=[0.75, 1.0, 0.45]
reach=16.0
falloff=1.6
short=0.4
radius=2.8
size_least=0.6
size_most=1.4
energy=0.6

; Landing from a fall, by how far the feet dropped (cells): nothing under
; `from` (a plain jump drops about 0.4), the whole pulse from `full` up.
[land]

pulse=[0.25, 0.9, 0.2]
from=0.7
full=3.5
least=0.2

; Whatever else shakes the screen (a boss's slam, a barn coming down, a
; level's script; not the guns, hits and blasts above): a pulse for each rise
; of the shake of `from` or more, the rise times `weak` and `strong`. Mixed
; with the rest by the bigger of the two, not added.
[quake]

from=0.08
weak=0.45
strong=1.0
seconds=0.3

; The bosses (the events of the same names): an entrance's roar, going
; fightin' mad, a new phase, a stagger, a hit on the weak spot, the fall.
[boss]

intro=[0.3, 0.7, 0.9]
enraged=[0.45, 0.8, 0.7]
phase=[0.35, 0.75, 0.5]
staggered=[0.25, 0.5, 0.15]
weak_hit=[0.4, 0.2, 0.08]
down=[0.6, 1.0, 1.2]

; In a vehicle (vehicles.cfg's kinds; [vehicle] for one with no section):
;   idle      [weak, strong] held while its engine runs standing still
;   top       [weak, strong] held at its top speed (between: by the speed)
;   chug, chug_hz   a single cylinder's thump on the strong motor, how hard
;             and how many a second (0: none)
;   chop, chop_hz   the hull on the chop: the weak motor swelling by this,
;             this many times a second, times the speed's share
;   rough     the weak motor's jolting on rough ground, times its
;             vehicles.cfg rough and rough_off and the speed's share
;   bump      a pulse for a wall struck at `bump_full` cells a second (less
;             by its share; nothing under `bump_from`); `crash` from
;             `crash_from` up instead
;   kerb      up a kerb or a step (at most one each `kerb_gap` seconds);
;             land down off a ledge falling at `land_full` cells a second
;             or more (less by its share; nothing under 1.2)
;   wreck     its tank going up with the player in it
[vehicle]

idle=[0.06, 0.1]
top=[0.2, 0.25]
chug=0.0
chug_hz=0.0
chop=0.0
chop_hz=0.0
rough=0.25
bump=[0.35, 0.7, 0.18]
bump_from=1.0
bump_full=8.0
crash=[0.6, 1.0, 0.35]
crash_from=5.0
kerb_gap=0.2
kerb=[0.15, 0.35, 0.08]
land=[0.3, 0.9, 0.22]
land_full=4.0
wreck=[0.8, 1.0, 0.6]

