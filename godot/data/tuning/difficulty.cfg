; Every number that changes with DIFFICULTY, one array each, in the order
; EASY, NORMAL, HARD, HOG WILD (src/core/difficulty.gd reads it).

; The player: how much a hit hurts, how much of an ammo pickup is given.
[player]
incoming=[0.66, 1.0, 1.34, 1.65]
ammo_scale=[1.0, 1.0, 0.75, 0.55]

; The county's hands: sharpness (attack recovery, notice range, aim), every
; how-many-th regular of a kind with a variant becomes it (0 none), seconds a
; hand searches, the stun of a hand hit from behind unaware, how far out a
; shot is heard (a share of the gun's noise); a squad's flankers out at once,
; the chance one is sent at a step and the wait after, pressing in likewise,
; and the wait between flushing throws.
[hands]
sharpness=[0.88, 1.0, 1.18, 1.36]
variant_every=[0, 9, 5, 3]
search=[6.0, 9.0, 13.0, 17.0]
sneak_stun=[1.6, 1.3, 1.0, 0.8]
hearing=[0.75, 1.1, 1.35, 1.6]
flankers=[0, 1, 1, 2]
flank_chance=[0.0, 0.7, 0.85, 0.95]
flank_wait=[0.0, 4.0, 3.0, 2.5]
press_chance=[0.0, 0.3, 0.6, 0.85]
press_wait=[0.0, 5.0, 3.5, 2.5]
flush_wait=[0.0, 14.0, 10.0, 7.0]
; Smarter hands (HANDS: SMART, src/hand_tactics.gd; EASY fights the classic
; way): the chance a ranged hand ducks into cover after a shot (classic 0.3),
; seconds in cover before it peeks out to shoot, whether it kicks doors open
; (1) or not (0), shots before it must reload (0 never), and the highest drop
; off a roof or a loft it takes to get at the player.
duck_chance=[0.3, 0.45, 0.65, 0.8]
peek_wait=[0.0, 1.3, 0.85, 0.5]
kick_doors=[0.0, 1.0, 1.0, 1.0]
magazine=[0, 6, 5, 5]
drop_max=[0.0, 1.9, 2.7, 3.3]

; The bosses: how many come as backup at each phase change.
[bosses]
backup=[2, 3, 3, 4]
