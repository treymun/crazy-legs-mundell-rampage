; Things that break when shot or blasted, read by src/features/breakables.gd.
; One section a picture as the levels stand it: a board's image, or prop_<name>
; for a prop. Godot ConfigFile text: keep each value's form (2.0, not 2).
;
;   broken  the picture it becomes (the props: scripts/blender/props_broken.py
;           through tools/art/build_town_props.gd; the signs' <name>_shot:
;           tools/art/build_break_art.gd)
;   hp      how much it takes: a shot's damage, or a blast's by how near it is
;   stuff   what its bits are (fx_brk_<stuff>_0 and _1) and how many it throws
;   bits
;   cue     its sound breaking; cue2 a second one with it; chip its sound
;           taking a shot that does not break it (missing: cue; a sign: sign_shot)
;   blast   it goes up a moment after it breaks, as this blast (shots.cfg)
;   sign    a painted sign: shot up where it hangs, a splinter or two
;
; A quest prop, a door, anything with a signal or a glow, and anything that
; alone parts one stretch of floor from another never breaks, whatever is here.

[all]

; Bits lying about at most; the oldest go when more come.
bits_max=150
; A blast pushes what it did not break this far out past its reach, at most
; push units (barrels, cans, coolers that stand loose).
shove_reach=1.6
shove_most=0.45

; Walls that break (src/features/wall_breaks.gd). Every window painted on a
; wall (a <material>_win or _lit tile, trailer_window) that has a
; <material>_brk tile (tools/art/wall_break_art.gd) shoots out: a shot into
; its glass or a blast within blast_reach. It stays a wall.
;   never   levels where no wall breaks
;   cue     its sound breaking, cue2 a second one with it
;   bits    glass bits thrown (fx_brk_glass_*), specks the game's own glints
;   heard   how far off a hand hears it go
[windows]

never=["hub"]
cue="break_window"
cue2="glass_settle"
bits=7
specks=14
heard=6.8
blast_reach=2.4

; A fence of planks: a solid cell of the tile [fence.<tile>] names takes a
; shot's damage (or a blast's, by how near), shows `hit` on its faces once
; down to `damaged` of its hp, and at none breaks through: open floor, the
; cells beside it showing their faces (in `hit`), `broken` standing in the gap.
; A cell whose opening would join ground the level keeps apart (behind a
; locked or quest door or gate), on the map's edge, under a roof, beside a
; step, or with something on it holds, shot about (wall_breaks.gd _rule).
;   chip    the knock of the shot that knocks it about
;   cue     its sound breaking through, cue2 with it
[fence.stockyard]

hit="stockyard_hit"
broken="stockyard_gap"
hp=90.0
damaged=0.6
stuff="wood"
bits=9
chip="impact_wood"
cue="break_fence"
cue2="debris_settle"
heard=5.0

