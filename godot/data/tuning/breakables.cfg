; Things that break when shot or blasted, read by src/features/breakables.gd.
; One section a picture as the levels stand it: a board's image, or prop_<name>
; for a prop. Godot ConfigFile text: keep each value's form (2.0, not 2).
;
;   broken  the picture it becomes (the props: scripts/blender/props_broken.py
;           through tools/art/build_town_props.gd; the signs' <name>_shot:
;           tools/art/build_break_art.gd)
;   hp      how much it takes: a shot's damage, or a blast's by how near it is
;   stuff   what its bits are (fx_brk_<stuff>_0 and _1) and how many it throws
;   bits
;   cue     its sound breaking; cue2 a second one with it; chip its sound
;           taking a shot that does not break it (missing: cue; a sign: sign_shot)
;   blast   it goes up a moment after it breaks, as this blast (shots.cfg)
;   sign    a painted sign: shot up where it hangs, a splinter or two
;   pieces  how it comes apart in real pieces of itself (src/wreck_fracture.gd:
;           boards:n, staves:n, table:n, shatter:n, tear:n, burst:n,
;           splinter:n, chunk:n for a model; staves:n, boards:n (a barrel or
;           crate stood up from its picture), splinter:n, planks:c,r,t for a
;           picture), each cut in several seeded variants, thrown by
;           src/features/wreckage.gd by the hit that broke it (looks only);
;           pieces_most throws only that many of them
;   gone    nothing is left standing where it broke (no broken picture: its
;           pieces are all of it)
;   never   levels where it never breaks (the 5v5 and 2v2 maps)
;
; A quest prop, a door, anything with a signal or a glow, and anything that
; alone parts one stretch of floor from another never breaks, whatever is here.

[all]

; Bits lying about at most; the oldest go when more come.
bits_max=150
; A blast pushes what it did not break this far out past its reach, at most
; push units (barrels, cans, coolers that stand loose).
shove_reach=1.6
shove_most=0.45
; A sign (sign=true) with a cracked picture (<sign>_crk) that a round under
; crack_most would break cracks first and goes on the next.
crack_most=50.0

; The real pieces broken things come apart into (src/features/wreckage.gd,
; looks only: never carried, saved or in anyone's way).
;   most    pieces lying about at most (most_phone on a phone); past it the
;           oldest shrink away in `fade` seconds
;   steps   small physics steps a tick
;   per_break  pieces one break throws at most (the biggest; per_break_phone
;           on a phone or the LOW tier, per_break_county on the County Run
;           maps, one long fight): the smallest are left to the debris
;   fine_most  fine debris bits (splinters, shards, straw: wreck_debris.gd,
;           not the solver) about at most (fine_most_phone)
;   dense   how heavy a piece is for its size (only one against another counts)
;   never   maps where nothing comes apart in pieces (the 5v5 and 2v2 maps)
[pieces]

on=true
most=48
most_phone=20
per_break=18
per_break_phone=10
per_break_county=10
fine_most=80
fine_most_phone=32
steps=2
fade=0.5
dense=500.0
never=["grainyard", "holler", "salvage", "pumpngo", "pineacres", "landing"]

; Walls that break (src/features/wall_breaks.gd). Every window painted on a
; wall (a <material>_win or _lit tile, trailer_window) that has a
; <material>_brk tile (tools/art/wall_break_art.gd) shoots out: a shot into
; its glass or a blast within blast_reach. It stays a wall.
;   never   levels where no wall breaks
;   cue     its sound breaking, cue2 a second one with it
;   bits    glass bits thrown (fx_brk_glass_*), specks the game's own glints
;   heard   how far off a hand hears it go
;   pieces  its glass in n by n panes of two shards each (shards:n), at most
;           pieces_most of them thrown (src/features/wreckage.gd), when
;           src/features/wall_looks.gd is not there to cut it fresh
;   shards_most  shards of a pane cut fresh round where it was struck
;           (wall_looks.gd) thrown at most (fewer on a phone); glints the
;           small pieces near the hole thrown as glints at most
[windows]

never=["hub"]
; Every first round breaks a window (play); one under crack_most only shows
; it cracked, its glass held in its frame (crack_cue sounds, its web where it
; struck: src/features/wall_looks.gd) until the next round, a blast or a body
; shoots the glass out. A round of crack_most or more (a big rifle, a magnum)
; and a blast shoot it out at once.
crack_most=50.0
crack_cue="glass_settle"
cue="break_window"
cue2="glass_settle"
bits=7
specks=14
heard=6.8
blast_reach=2.4
pieces="shards:3"
pieces_most=12
shards_most=14
glints=10

; A fence of planks: a solid cell of the tile [fence.<tile>] names takes a
; shot's damage (or a blast's, by how near), shows `hit` on its faces once
; down to `damaged` of its hp, and at none breaks through: open floor, the
; cells beside it showing their faces (in `hit`), `broken` standing in the gap.
; A cell whose opening would join ground the level keeps apart (behind a
; locked or quest door or gate), on the map's edge, under a roof, beside a
; step, or with something on it holds, shot about (wall_breaks.gd _rule).
;   chip    the knock of the shot that knocks it about
;   cue     its sound breaking through, cue2 with it
;   pieces  its boards and rails (fence:n,v...: n upright boards, a rail at
;           each v down from its top), pieces_shot of them off when it is shot
;           about, up to pieces_most more when it breaks through
;           (src/features/wall_looks.gd: its planks as they were shot out, and
;           pieces_most boards at most bursting out when it goes through; bits
;           kept few so the boards read, not a cloud of specks)
; Plank walls (src/plank_walls.gd, docs/dev/gameplay.md "Walls break too"):
;   sheds       a cell between a roofed floor and the open air (a shed's or a
;               barn's wall, straight through) may open under its roof: the gap
;               takes the roof, a gable above it stays; only where its faces
;               are its own boards, `inside`'s or trim, with no window, door,
;               gate or deck beside it and a roof a body's height up
;   under_roof  a cell under a roof itself (a pen's fence in a barn) may open
;   straight    only a cell open on two opposite sides opens (not a corner)
;   only_open   a cell of it that may not open is left whole (not shot about)
[fence.stockyard]

; The 5v5 maps' fences hold: a hole shot in one would be a lane the map
; never meant (and the bots' plans walk round).
never=["grainyard", "holler", "salvage", "pumpngo", "pineacres", "landing"]
hit="stockyard_hit"
broken="stockyard_gap"
hp=90.0
damaged=0.6
stuff="wood"
bits=4
chip="impact_wood"
cue="break_fence"
cue2="debris_settle"
heard=5.0
pieces="fence:6,0.14,0.44,0.76"
pieces_shot=2
pieces_most=10
sheds=true
under_roof=true
inside=["stockyard", "wood", "barn", "detail_wall_feed_pen_boards", "detail_wall_shed_repair"]

