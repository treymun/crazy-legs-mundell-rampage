; How each kind of blast looks in the graphics-card view's gun and blast
; layer (features/gun_fx.gd, src/blast_looks.gd; LIGHTS AND GLOW on). Looks
; only: nothing here changes a blast's damage, reach or shove (shots.cfg).
; Every blast also rolls its own dice on top of these (the fireball's shape
; and turn, how many lobes and where, the column's lean, the scraps' count
; and arcs, the crater's shape and size), so no two look alike, and changes
; with where it went off: in water (a column of water, steam, no crater), on
; a deck or a floor that is not the ground (a scorch, splinters, no crater)
; or against a wall (the fire and the scraps thrown off it).
;
; [all]
;   most_bits, most_bits_low   bits in the air at most (a phone or QUALITY LOW
;                              takes the second); past it the oldest go
;   chain_less     each blast within a second of the last throws this share
;                  fewer bits (a chain), down to chain_least; its fireball and
;                  flash are always whole, so each boom of a chain reads
;   kick_reach     cells within which a blast kicks the view (features/feel.gd
;                  punch(), by SCREEN SHAKE), kick the most it kicks at its middle
;   debris_cue     the sound of what it threw raining down, debris_after seconds
;                  later, for a blast that throws debris_from scraps or more
;
; [kinds]  shots.cfg kind = look (missing: "blast")
; [from]   a breakable's picture that went up = look (what blew, not just the
;          blast kind it sets off: a propane tank and a hazard drum are both
;          "fuel" blasts in play)
;
; [look.<name>]
;   fire        fireball's colours: "d" (dynamite, powder, propane: yellow-white)
;               or "f" (fuel: deep orange, black soot)
;   ball        fireball size (1 a stick's)
;   life        seconds the fireball burns through its frames
;   lobes       smaller fireballs bursting beside it, at most (dice: 1 to it)
;   column      soot puffs up the column; rise how fast it climbs; cap puffs
;               spreading at its top (a mushroom)
;   smoke       the column's smoke: "soot" or "powder" (a keg's grey-white)
;   scraps      scraps flung out trailing smoke; scrap the kind ("" charred
;               wood, "metal", "meat"); fling how hard
;   clods       dirt thrown up out of the crater (none off a deck or in water)
;   puffs       dirt puffs rolling out along the ground (the dust ring)
;   sparks      white-hot sparks flung out
;   embers      burning bits rising off it a while
;   fire_rain   burning drops thrown up that fall and lie burning a moment
;   crater      the crater's size (0: a scorch only)
;   flash, glow its light's strength and its afterglow's (effects.cfg
;               [light.blast_flash], [light.boom_glow])
;   kick        how hard it kicks the view (times [all] kick)
;   layer       a sound played with the blast's own (shots.cfg cue), or ""

[all]

most_bits=200
most_bits_low=90
chain_less=0.18
chain_least=0.35
kick_reach=7.0
kick=1.0
debris_cue="blast_debris"
debris_after=0.55
debris_from=5

[kinds]

tnt="tnt"
king_dynamite="tnt"
